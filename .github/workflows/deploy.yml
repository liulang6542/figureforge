name: Deploy 超级AI绘图 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify workflow lock
        run: node scripts/check-forge-workflow-lock.mjs
      - name: Verify chat and PDF parsing
        run: >-
          node --test
          forge/test-chat-api.mjs
          forge/test-openai-pdf.mjs
          forge/test-infistar-reconstruction-stream.mjs
          nonelinear-relay/test-worker.mjs
          nonelinear-relay/test-references.mjs
          nonelinear-relay/test-source-image.mjs
          nonelinear-relay/test-chat-stream.mjs
      - name: Verify editable export
        run: node forge/test-editable-export.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
