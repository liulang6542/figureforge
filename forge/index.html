      finally{reader.releaseLock();}
    }else{text=await r.text();responseBytes=new TextEncoder().encode(text).length;}
    const elapsedMs=now()-started;
    rec.status=r.status; rec.ms=elapsedMs;
    rec.resp=text?inspMask(text.length>8000?text.slice(0,8000)+'\n…（共 '+text.length+' 字符）':text):'[空响应]';
    inspCommit(rec);
    return {ok:r.ok,status:r.status,retryAfter:r.headers.get('retry-after'),text,transport:{headersMs,firstBodyChunkMs,responseBytes,elapsedMs}};
  }catch(err){
    rec.status=0; rec.resp='[请求失败] '+((err&&err.message)||err); inspCommit(rec);
    if(options.signal?.aborted)throw new DOMException("Reconstruction stopped","AbortError");
    if(ac.signal.aborted){
      const timeout=new Error('Vision API timed out after '+Math.round(timeoutMs/1000)+' seconds');
      timeout.visionTimeout=true;
      throw timeout;
    }
    throw err;
  }finally{ clearTimeout(to); options.signal?.removeEventListener("abort",cancel); }
}
/* When a POST fails at network level, find out WHY. Some providers (Ark) do
   not allow browser CORS on /models, and omit CORS headers on error responses,
   so the real 401/404 can be invisible to the page. */
async function diagnoseConnection(base, key, modelId, kind='chat', prov=Store.providerId()){
  // 1) model-list endpoint (works on providers that allow browser CORS on it)
  try{
    const r = await fetch(base+'/models',{headers:{Authorization:'Bearer '+key}});
    if(r.ok){
      let list=[];
      try{ const d=await r.json(); list=(d.data||d.models||[]).map(x=>x.id||x.model||x.name); }catch{}
      if(modelId && list.length && !list.includes(modelId))
        return tt('diag.notenabled',{m:modelId});
      return '';
    }
    if(r.status===401) return tt('err.401');
    if(r.status===403) return tt('diag.403');
  }catch(e){ /* /models unreachable from this browser (e.g. Ark) -> probe below */ }
  // 2) Ark-style fallback: a minimal chat call against the same model
  if(kind==='chat' && modelId){
    try{
      const probe={model:modelId,max_tokens:1,messages:[{role:'user',content:'hi'}]};
      // 直连方舟时才需要显式关掉思考；走中转地址时不发这个字段
      if(flagsOf(prov).disableThinking && /ark\.[^/]*volces\.com/i.test(base)) probe.thinking={type:'disabled'};
      const r=await postJSON(base,'/chat/completions',probe,key);
      if(r.ok) return '';  // key + model fine; original failure was payload/transient
      let txt=''; try{ txt=await r.text(); }catch{}
      if(r.status===401) return tt('err.401');
      if(r.status===404) return tt('diag.notenabledArk',{m:modelId});
      return friendlyHttp(r.status,txt,prov);
    }catch(e){
      return tt('diag.unreachable');
    }
  }
  return tt('diag.generic');
}

async function genOaiSVG(base,model,key,content,p,refIds,layoutGuide){
  const useIds = refIds||[...refs];
  const prompt = buildPrompt(content,layoutGuide,useIds);
  let body = {model,temperature:0.3,max_tokens:96000}, usedVision=false;
  if(flagsOf(p).disableThinking && /ark\.[^/]*volces\.com/i.test(base)) body.thinking={type:'disabled'};
  if(useIds.length && p!=='ds'){
    const uris = await refDataURIs(useIds);
    const parts = uris.map(u=>({type:'image_url',image_url:{url:u}}));
    parts.push({type:'text',text:prompt});
    body.messages=[{role:'system',content:SVG_SYS},{role:'user',content:parts}];
    usedVision=true;
  }else{
    body.messages=[{role:'system',content:SVG_SYS},{role:'user',content:prompt}];
  }
  let r;
  try{ r = await postJSON(base,'/chat/completions',body,key); }
  catch(e){
    if(e.name==='TimeoutError') throw new Error(tt('svg.timeout'));
    const diag=await diagnoseConnection(base,key,model);
    throw new Error(diag || tt('svg.blocked'));
  }
  let txt = await r.text();
  // Preserve references on provider failures; never silently switch to text-only.
  if(!r.ok) throw new Error(friendlyHttp(r.status,txt,p));
  const d = JSON.parse(txt);
  const parsed = extractSvgCode(d.choices?.[0]?.message?.content||'', true);
  const code = parsed.code;
  if(!code) throw new Error(tt('svg.none'));
  const auditRes = await auditAndRepair(code, {base, model, key, provider:p, anthropic:false},
    (r,n)=>setGenNote(tt('audit.repairing',{r:r, n:n})), parsed.truncated);
  renderSVG(auditRes.svg, usedVision, useIds, parsed.truncated, auditRes);
}

async function genAnthropicSVG(base,model,key,content,refIds,layoutGuide){
  const useIds = refIds||[...refs];
  const prompt = buildPrompt(content,layoutGuide,useIds);
  let blocks = [], usedVision=false;
  if(useIds.length){
    const uris = await refDataURIs(useIds);
    uris.forEach(u=>{
      const p = dataURIToParts(u);
      if(p) blocks.push({type:'image',source:{type:'base64',media_type:p.media,data:p.data}});
    });
    usedVision = blocks.length>0;
  }
  blocks.push({type:'text',text:prompt});
  let body = {model,max_tokens:96000,temperature:0.3,system:SVG_SYS,messages:[{role:'user',content:blocks}]};
  let r;
  try{
    r = await fetchWithTimeout(base.replace(/\/+$/,'')+'/v1/messages',{method:'POST',
      headers:anthropicHeaders(key),
      body:JSON.stringify(body)});
  }catch(e){ throw new Error(tt(e.name==='TimeoutError'?'svg.timeout':'svg.claudeConn')); }
  let txt = await r.text();
  if(!r.ok && usedVision){
    body.messages=[{role:'user',content:prompt}]; usedVision=false;
    try{
      r = await fetchWithTimeout(base.replace(/\/+$/,'')+'/v1/messages',{method:'POST',
        headers:anthropicHeaders(key),
        body:JSON.stringify(body)});
      txt=await r.text();
    }catch(e){}
  }
  if(!r.ok) throw new Error(friendlyHttp(r.status,txt,p));
  const d = JSON.parse(txt);
  const out = (d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  const parsed = extractSvgCode(out, true);
  const code = parsed.code;
  if(!code) throw new Error(tt('svg.claudeNone'));
  const auditRes = await auditAndRepair(code, {base, model, key, provider:'claude', anthropic:true},
    (r,n)=>setGenNote(tt('audit.repairing',{r:r, n:n})), parsed.truncated);
  renderSVG(auditRes.svg, usedVision, useIds, parsed.truncated, auditRes);
}
/* ---------------- geometry audit: measure the draft before showing it ----------------
   The generator has no idea whether its own coordinates fit the canvas, and nothing
   checked: overflowing labels, text spilling out of its panel and colliding labels all
   shipped silently. This renders the SVG at the real canvas size off-screen and
   measures every label, so defects are facts rather than guesses. */
const AUDIT_TOLERANCE = 2;      // px of slack before something counts as outside
const OVERLAP_MIN = 12;         // px of intersection before labels count as colliding
const MAX_DEFECTS = 10;         // cap the repair instruction length
const MAX_REPAIR_ROUNDS = 2;

function readViewBox(svgEl){
  const vb = (svgEl.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
  if(vb.length===4 && vb.every(n=>isFinite(n)) && vb[2]>0 && vb[3]>0) return {x:vb[0],y:vb[1],w:vb[2],h:vb[3]};
  const w = parseFloat(svgEl.getAttribute('width'))||0, h = parseFloat(svgEl.getAttribute('height'))||0;
  if(w>0 && h>0) return {x:0,y:0,w:w,h:h};
  return null;
}

/* The box a label visually belongs to: the smallest painted rect on the canvas
   whose area contains the label's centre. Implemented by geometry rather than by
   ancestor lookup because generators emit both nested (<g><rect/><text/></g>) and
   flat (<rect/><text/> as siblings) structures, and an ancestor-only search finds
   nothing in the flat case. */
function panelBoxFor(node, labelBox, canvas){
  const cx = labelBox.x + labelBox.width/2;
  const cy = labelBox.y + labelBox.height/2;
  let best = null, bestArea = Infinity;
  [...canvas.querySelectorAll('rect')].forEach(rect=>{
    let b; try{ b = rect.getBBox(); }catch(e){ return; }
    if(!b || b.width<=2 || b.height<=2) return;
    if(b.width >= canvas.clientWidth - 1 && b.height >= canvas.clientHeight - 1) return;  // page background
    const pad = 2;
    if(cx < b.x+pad || cx > b.x+b.width-pad || cy < b.y+pad || cy > b.y+b.height-pad) return;
    const area = b.width*b.height;
    if(area < bestArea){ bestArea = area; best = {rect, box:b}; }
  });
  return best;
}

function auditGeometry(svgText){
  const defects = [];
  const stats = {texts:0, overflow:0, panel:0, overlap:0, panelsFound:0, panelSkipped:0, viewBox:null};
  let host=null;
  try{
    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
    if(doc.querySelector('parsererror')) return {defects:[{kind:'parse', detail:'SVG could not be parsed'}], stats, broken:true, svgText};
    const root = doc.documentElement;
    if(!root || root.tagName.toLowerCase()!=='svg') return {defects:[{kind:'parse', detail:'root element is not <svg>'}], stats, broken:true, svgText};
    const vb = readViewBox(root);
    if(!vb) return {defects:[{kind:'parse', detail:'no usable viewBox or width/height'}], stats, broken:true, svgText};

    host = document.createElement('div');
    host.setAttribute('aria-hidden','true');
    host.style.cssText = `position:fixed;left:-100000px;top:0;width:${vb.w}px;height:${vb.h}px;overflow:hidden;pointer-events:none;`;
    const live = document.importNode(root, true);
    live.setAttribute('width', vb.w);
    live.setAttribute('height', vb.h);
    host.appendChild(live);
    document.body.appendChild(host);

    // Only <text> is measured: a <text> that contains <tspan> children already
    // covers them, and counting both would report phantom collisions.
    const nodes = [...host.querySelectorAll('text')].filter(n=>{
      const s = getComputedStyle(n);
      if(s.display==='none' || s.visibility==='hidden' || parseFloat(s.opacity)===0) return false;
      return (n.textContent||'').trim().length>0;
    });
    stats.texts = nodes.length;

    const boxes = [];
    nodes.forEach(n=>{
      let box;
      try{ box = n.getBBox(); }catch(e){ return; }   // <text> with no glyphs throws in some engines
      if(!box || box.width<=0 || box.height<=0) return;
      const label = (n.textContent||'').trim().replace(/\s+/g,' ').slice(0,42);
      boxes.push({box, label});

      const outL = vb.x - (box.x - AUDIT_TOLERANCE);
      const outT = vb.y - (box.y - AUDIT_TOLERANCE);
      const outR = (box.x + box.width) - (vb.x + vb.w) - AUDIT_TOLERANCE;
      const outB = (box.y + box.height) - (vb.y + vb.h) - AUDIT_TOLERANCE;
      if(outL>0 || outT>0 || outR>0 || outB>0){
        stats.overflow++;
        const parts = [];
        if(outL>0) parts.push(`left by ${Math.round(outL)}px`);
        if(outR>0) parts.push(`right by ${Math.round(outR)}px`);
        if(outT>0) parts.push(`top by ${Math.round(outT)}px`);
        if(outB>0) parts.push(`bottom by ${Math.round(outB)}px`);
        defects.push({kind:'overflow', label,
          detail:`label "${label}" runs past the canvas ${parts.join(' and ')}`,
          fix:`shorten this label or move/shrink it so it stays inside x=0..${Math.round(vb.w)}, y=0..${Math.round(vb.h)}`});
      }

      const panel = panelBoxFor(n, box, live);
      if(panel){
        stats.panelsFound++;
        const over = (box.x + box.width) - (panel.box.x + panel.box.width);
        if(over > AUDIT_TOLERANCE*3){
          stats.panel++;
          defects.push({kind:'panel', label,
            detail:`label "${label}" is ${Math.round(over)}px wider than the box it belongs to`,
            fix:`shorten this label, reduce its font-size, or widen that box so the text fits with padding`});
        }
      }
    });

    // Label collisions. Vertical overlap must be substantial, else an axis tick
    // and a caption that merely share a band would be reported.
    for(let i=0;i<boxes.length;i++){
      for(let j=i+1;j<boxes.length;j++){
        const a=boxes[i].box, b=boxes[j].box;
        const ox = Math.min(a.x+a.width, b.x+b.width) - Math.max(a.x, b.x);
        const oy = Math.min(a.y+a.height, b.y+b.height) - Math.max(a.y, b.y);
        if(ox>OVERLAP_MIN && oy>Math.min(a.height,b.height)*0.35){
          stats.overlap++;
          defects.push({kind:'overlap', label:boxes[i].label,
            detail:`"${boxes[i].label}" overlaps "${boxes[j].label}" by ${Math.round(ox)}x${Math.round(oy)}px`,
            fix:`separate these two labels (move, shorten or shrink) so they do not overlap`});
        }
      }
    }

    stats.viewBox = vb;
    return {defects:defects.slice(0, MAX_DEFECTS), stats, broken:false, svgText:new XMLSerializer().serializeToString(live)};
  }catch(e){
    return {defects:[{kind:'audit', detail:'audit failed: '+e.message}], stats, broken:false, svgText};
  }finally{
    if(host && host.parentNode) host.parentNode.removeChild(host);
  }
}

async function repairSVG(svgText, defects, req){
  const list = defects.map((d,i)=>`${i+1}. ${d.detail} -> ${d.fix}`).join('\n');
  const instruction =
`Fix ONLY the defects listed below. Change as little as possible: keep every panel, arrow, colour, position and label that is not named here.
Do not redesign, do not rename labels that are already correct, do not add or remove elements.
${list}

Return the complete corrected SVG only, no explanation, no code fences. Start with <svg and end with </svg>.`;
  const {base, model, key, provider} = req;
  if(req.anthropic){
    const body = {model, max_tokens:96000, temperature:0.1, system:SVG_SYS,
      messages:[{role:'user',content:[{type:'text',text:svgText},{type:'text',text:instruction}]}]};
    const r = await fetchWithTimeout(base.replace(/\/+$/,'')+'/v1/messages',{method:'POST',headers:anthropicHeaders(key),body:JSON.stringify(body)});
    const txt = await r.text();
    if(!r.ok) throw new Error(friendlyHttp(r.status, txt, provider));
    const d = JSON.parse(txt);
    return (d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  }
  const body = {model, temperature:0.1, max_tokens:96000,
    messages:[{role:'system',content:SVG_SYS},{role:'user',content:svgText+'\n\n'+instruction}]};
  if(flagsOf(provider).disableThinking) body.thinking={type:'disabled'};
  const r = await postJSON(base,'/chat/completions',body,key);
  const txt = await r.text();
  if(!r.ok) throw new Error(friendlyHttp(r.status, txt, provider));
  const d = JSON.parse(txt);
  return d.choices?.[0]?.message?.content||'';
}

/* Extract the SVG from a model reply.
   When the reply was cut off, the old behaviour was to chop at the cut and glue a
   literal `</svg>` on, which often left a half-finished tag and a structurally
   broken document. Completing only the root element instead produces something
   well-formed: whatever partial element is dangling can no longer swallow the rest
   of the document, and the geometry audit then measures the real result. */
function extractSvgCode(raw, autoClose){
  const code = (raw.match(/<svg[\s\S]*?<\/svg>/)||[])[0] || '';
  if(code) return {code, truncated:false, completed:false};
  const s2 = raw.match(/<svg[\s\S]*$/);
  if(!s2) return {code:'', truncated:false, completed:false};
  let body = s2[0].replace(/```[\s\S]*$/,'').trim();
  if(autoClose){
    // Drop a trailing partial tag so the closing root element is valid markup.
    body = body.replace(/<[^>]*$/,'').trimEnd();
    body += '</svg>';
    return {code:body, truncated:true, completed:true};
  }
  return {code:body, truncated:true, completed:false};
}

/* Audit, then optionally repair. The current draft is kept unless a repair
   measurably reduces the defect count, so a bad repair cannot make things worse.
   A cut-off draft is measured but not repaired: a truncated figure is incomplete
   by definition, so the useful action is to say so, not to polish it. */
async function auditAndRepair(svgText, req, onProgress, wasTruncated){
  let current = svgText;
  let report = auditGeometry(current);
  const first = report.defects.length;
  let rounds = 0, repaired = 0;
  const log = [{round:0, defects:first, kinds:report.defects.map(d=>d.kind)}];

  while(!wasTruncated && report.defects.length && !report.broken && rounds < MAX_REPAIR_ROUNDS){
    if(onProgress) onProgress(rounds+1, report.defects.length);
    rounds++;
    let candidateText = '';
    try{
      candidateText = await repairSVG(current, report.defects, req);
    }catch(e){
      log.push({round:rounds, error:String(e.message||e).slice(0,160)});
      break;
    }
    const extracted = extractSvgCode(candidateText, false);
    if(!extracted.code || !extracted.completed && extracted.truncated){
      log.push({round:rounds, error:'repair returned no complete SVG'});
      break;
    }
    const candidate = auditGeometry(extracted.code);
    log.push({round:rounds, defects:candidate.defects.length, kinds:candidate.defects.map(d=>d.kind)});
    if(candidate.broken || candidate.defects.length >= report.defects.length) break;
    current = extracted.code;
    report = candidate;
    repaired = rounds;
  }
  // `truncated` here means "unfinished draft", regardless of which pass produced it.
  return {svg:current, audit:report, rounds, repaired, first, truncated:!!wasTruncated, log};
}

function auditSummaryText(res){
  if(!res) return '';
  const left = res.audit.defects.length;
  if(res.first===0) return tt('audit.clean');
  if(res.repaired>0) return tt('audit.fixed',{a:res.first, b:left, r:res.repaired});
  if(left>0) return tt('audit.left',{n:left});
  return '';
}

/* ---------------- Editable export step ----------------
   The SVG produced in step 3 already carries the two things an editable file
   needs: exact geometry, and labels as real <text> strings. So the export parses
   that SVG element by element and emits native shapes and text boxes for each
   target format. Two rules follow from that and both matter:

     1. Text is never re-recognised (no OCR, no bitmap tracing). The string in the
        SVG is copied verbatim, so the exported labels cannot be misspelled.
     2. Positions come from the measured SVG, not from a model's guess, so nothing
        drifts between the preview and the exported file.

   Bitmap drafts have neither property, so they take one extra step first: a vision
   model reads the image and returns a scene, which is then normalised, audited and
   written by exactly the same renderers. That step is what turns a bitmap into an
   editable figure, and it is the only place a model is involved at all.

   Export packaging runs in the browser. A Step 3 bitmap automatically triggers
   vision reconstruction through the configured provider before downloads unlock;
   its scene is then written into native PPTX, VSDX, SVG and draw.io elements. */
window.__ffExportState = {svg:'', baseSvg:'', scene:null, target:'svg', font:'original', source:'svg', bitmap:'', reconBitmap:'', recon:null, reconPending:false, reconFailed:false, reconError:'', hasStep3Output:false};
// Keep the Step 3 raster in a durable page-level slot.  The async reconstruction
// can fail or refresh the export card without meaning that Step 3 lost its image.
window.__ffStep3Bitmap = '';
// Keep a second reference outside the export state.  The export card can be
// re-rendered while the vision request is pending; that must not discard the
// image that Step 3 already produced.
window.__ffLastGeneratedImage = '';

/* ---------- canvas units ---------- */
const EXPORT_CANVAS = {w:1600, h:900};
// 1600 canvas units -> 10in wide figure, centred on a 13.333x7.5in 16:9 slide.
const PT_PER_UNIT = 0.45;

/* ---------- colour / unit helpers ---------- */
function svgColorToHex(value){
  if(!value) return null;
  let v = String(value).trim().toLowerCase();
  if(v==='none' || v==='transparent') return null;
  if(v==='currentcolor') return '000000';
  if(/^[0-9a-f]{3}$/.test(v)) return v.split('').map(c=>c+c).join('').toUpperCase();
  if(/^[0-9a-f]{6}$/.test(v)) return v.toUpperCase();
  if(/^[0-9a-f]{8}$/.test(v)) return v.slice(0,6).toUpperCase();
  if(/^#[0-9a-f]{3}$/.test(v)) return v.slice(1).split('').map(c=>c+c).join('').toUpperCase();
  if(/^#[0-9a-f]{6}$/.test(v)) return v.slice(1).toUpperCase();
  if(/^#[0-9a-f]{8}$/.test(v)) return v.slice(1,7).toUpperCase();   // drop alpha

      const rot = Math.atan2(m[1], m[0]) * 180/Math.PI;

      nodes.push({type:'rect', x:x0, y:y0, w:x1-x0, h:y1-y0, radius:rx,
        fill:svgColorToHex(st.fill), stroke:svgColorToHex(st.stroke),
        strokeWidth:parseFloat(st.strokeWidth)||0, dash:dashOf(st), rotate:Math.abs(rot)>0.01?rot:0});
      return;
    }

    if(tag==='circle' || tag==='ellipse'){
      const cx=num('cx',0), cy=num('cy',0);
      const rx = tag==='circle' ? num('r',0) : num('rx',0);
      const ry = tag==='circle' ? num('r',0) : num('ry',0);
      if(rx<=0 || ry<=0) return;
      const c = applyMatrix(m, cx, cy);
      const scaleX = Math.hypot(m[0], m[1]) || 1;
      const scaleY = Math.hypot(m[2], m[3]) || 1;
      nodes.push({type:'ellipse', x:c.x-rx*scaleX, y:c.y-ry*scaleY, w:rx*2*scaleX, h:ry*2*scaleY,
        fill:svgColorToHex(st.fill), stroke:svgColorToHex(st.stroke),
        strokeWidth:parseFloat(st.strokeWidth)||0, dash:dashOf(st)});
      return;
    }

    if(tag==='line'){
      const p1 = applyMatrix(m, num('x1',0), num('y1',0));
      const p2 = applyMatrix(m, num('x2',0), num('y2',0));
      nodes.push({type:'line', x:p1.x, y:p1.y, x2:p2.x, y2:p2.y,
        stroke:svgColorToHex(st.stroke), strokeWidth:parseFloat(st.strokeWidth)||1,
        dash:dashOf(st), arrow:arrowOf(st)});
      return;
    }

    if(tag==='polygon' || tag==='polyline' || tag==='path'){
      const d = el.getAttribute('d');
      const pts = el.getAttribute('points');
      let bbox = null;
      try{ bbox = el.getBBox(); }catch(_){ bbox = null; }
      if(bbox && (bbox.width>0 || bbox.height>0)){
        const corners = [applyMatrix(m,bbox.x,bbox.y), applyMatrix(m,bbox.x+bbox.width,bbox.y),
                         applyMatrix(m,bbox.x,bbox.y+bbox.height), applyMatrix(m,bbox.x+bbox.width,bbox.y+bbox.height)];
        const xs=corners.map(c=>c.x), ys=corners.map(c=>c.y);
        const parsed=tag==='path'?parseEditablePath(d):null;
        if(tag==='path' && parsed.length===1 && !parsed[0].closed && parsed[0].commands.length===1 && parsed[0].commands[0].type==='line'){
          const p1=applyMatrix(m,parsed[0].start.x,parsed[0].start.y);
          const p2=applyMatrix(m,parsed[0].commands[0].end.x,parsed[0].commands[0].end.y);
          nodes.push({type:'line',x:p1.x,y:p1.y,x2:p2.x,y2:p2.y,
            stroke:svgColorToHex(st.stroke),strokeWidth:parseFloat(st.strokeWidth)||1,
            dash:dashOf(st),arrow:arrowOf(st)});
          return;
        }
        nodes.push({type:tag==='path'?'path':'polyline',
          x:Math.min(...xs), y:Math.min(...ys),
          w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys),
          d:tag==='path'?transformedPath(d,m):null,
          points:tag==='path'?null:transformedPoints(pts,m),
          fill:svgColorToHex(st.fill), stroke:svgColorToHex(st.stroke),
          strokeWidth:parseFloat(st.strokeWidth)||1,
          dash:dashOf(st), arrow:arrowOf(st),
          closed: tag==='polygon'});
      } else warnings.push(tag+' element without measurable bounds was skipped');
      return;
    }

    if(tag==='image'){
      const href = el.getAttribute('href') || el.getAttribute('xlink:href') || '';
      const x=num('x',0), y=num('y',0), w=num('width',0), h=num('height',0);
      if(!href) return;
      const iw=w||vb[2], ih=h||vb[3];
      const corners=[applyMatrix(m,x,y),applyMatrix(m,x+iw,y),applyMatrix(m,x,y+ih),applyMatrix(m,x+iw,y+ih)];
      const xs=corners.map(p=>p.x), ys=corners.map(p=>p.y);
      if(Math.abs(m[1])>1e-6 || Math.abs(m[2])>1e-6)
        warnings.push('rotated or skewed image uses its transformed bounds');
      nodes.push({type:'image', x:Math.min(...xs), y:Math.min(...ys),
        w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys), href});
      return;
    }

    if(tag==='text'){
      // tspan children with their own x/y are separate lines; otherwise the whole
      // string is one label and the parent's position is authoritative.
      const kids = [...el.children].filter(c=>(c.tagName||'').toLowerCase()==='tspan');
      const positioned = kids.filter(k=>k.getAttribute('x')!=null || k.getAttribute('y')!=null);
      if(positioned.length && positioned.length===kids.length && kids.length>1){
        kids.forEach(k=>emitText(k, m, st, el));
        return;
      }
      emitText(el, m, st, el);
      return;
    }

    // Unknown element types: recurse so nothing nested is lost.
    if(el.children && el.children.length) [...el.children].forEach(child=>walk(child, m));
  }

  function emitText(el, matrix, inherited, styleSource){
    const text = (el.textContent||'').replace(/\s+/g,' ').trim();
    if(!text) return;
    const st = Object.assign({}, inherited, styleOf(el));
    const base = styleSource || el;
    const xRaw = el.getAttribute('x')!=null ? parseFloat(el.getAttribute('x')) : parseFloat(base.getAttribute('x'));
    const yRaw = el.getAttribute('y')!=null ? parseFloat(el.getAttribute('y')) : parseFloat(base.getAttribute('y'));
    const x = Number.isFinite(xRaw) ? xRaw : 0;
    const y = Number.isFinite(yRaw) ? yRaw : 0;
    let fontSize = parseFloat(st.fontSize);
    if(!Number.isFinite(fontSize) || fontSize<=0) fontSize = 16;

    let box = null;
    try{ box = el.getBBox(); }catch(_){ box = null; }
    const anchor = (st.textAnchor||'start').toLowerCase();
    // getBBox includes text-anchor and the real ascender. SVG x/y is a
    // baseline point, while every editable exporter expects a box top-left.
    const fallbackWidth = text.length*fontSize*0.58;
    const sourceBox = box && box.width>0 && box.height>0 ? box : {
      x:x-(anchor==='middle'?fallbackWidth/2:anchor==='end'?fallbackWidth:0),
      y:y-fontSize*0.8, width:fallbackWidth, height:fontSize*1.25,
    };
    const center = applyMatrix(matrix, sourceBox.x+sourceBox.width/2, sourceBox.y+sourceBox.height/2);
    const scaleX = Math.hypot(matrix[0],matrix[1]) || 1;
    const scaleY = Math.hypot(matrix[2],matrix[3]) || 1;
    const width = sourceBox.width*scaleX, height = sourceBox.height*scaleY;
    const rotation = Math.atan2(matrix[1],matrix[0])*180/Math.PI;
    if(Math.abs(matrix[0]*matrix[2]+matrix[1]*matrix[3])>1e-5)
      warnings.push('skewed text was approximated by a rotated editable text box');

    nodes.push({
      type:'text', text,
      x:center.x-width/2, y:center.y-height/2, w:width, h:height,
      fontSize: fontSize*scaleY,
      anchor:'start', svgAnchor:anchor,
      baselineRatio: (y-sourceBox.y)/Math.max(sourceBox.height,1),
      rotation: Math.abs(rotation)>0.01?rotation:0,
      fill: svgColorToHex(st.fill) || '000000',
      fontFamily: st.fontFamily || null,
      bold: String(st.fontWeight||'').match(/^(bold|[6-9]00)$/) ? true : false,
      italic: String(st.fontStyle||'')==='italic',
      role: el.getAttribute('data-role') || null,
    });
  }

  try{
    walk(live, [1,0,0,1,0,0]);
  } finally {
    if(host.parentNode) host.parentNode.removeChild(host);
  }

  return {
    schema:'figureforge.scene.v2',
    canvas:{x:vb[0], y:vb[1], width:vb[2], height:vb[3], viewBox:vb.join(' ')},
    nodes,
    counts:{total:nodes.length, text:nodes.filter(n=>n.type==='text').length,
            shapes:nodes.filter(n=>n.type!=='text'&&n.type!=='image').length,
            images:nodes.filter(n=>n.type==='image').length},
    warnings,
  };
}

function escapeSvgAttr(value){
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));
}
function xmlEscape(value){
  return String(value==null?'':value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));
}
function rasterToExportSvg(src){
  const href=escapeSvgAttr(src);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><image href="${href}" x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid meet" data-role="raster-image"/></svg>`;
}
function downloadText(filename,text,type){
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadBlob(filename,blob){
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}

function applyExportFont(font){
  const st=window.__ffExportState; if(!st.baseSvg) return;
  // A replacement font changes glyph geometry. The pixel correction made for
  // the original font would cover the replacement, so use native mode instead.
  if(font!=='original' && st.source==='bitmap' && st.exportMode==='fidelity' && st.vectorSvg){
    st.exportMode='vector'; st.baseSvg=st.vectorSvg;
    const mode=$('#exportMode'); if(mode) mode.value='vector';
  }
  let svg=st.baseSvg;
  if(font!=='original'){
    const doc=new DOMParser().parseFromString(svg,'image/svg+xml');
    [...doc.querySelectorAll('text,tspan')].forEach(el=>{el.setAttribute('font-family',font); el.style.fontFamily=font;});
    svg=new XMLSerializer().serializeToString(doc);
  }
  st.font=font; st.svg=svg;
  try{
    st.scene=(font==='original' && st.source==='bitmap')
      ? (st.exportMode==='fidelity' ? st.fidelityScene : st.vectorScene) || parseBitmapSvgScene(svg)
      : (st.source==='svg' ? parseSvgScene(svg) : parseBitmapSvgScene(svg));
    if(st.scene && st.source==='svg') st.scene.svgSource=true;
  }catch(e){ st.scene=null; }
  renderEditableExportCard();
  if(window.__ffExportPreviewUrl) URL.revokeObjectURL(window.__ffExportPreviewUrl);
  window.__ffExportPreviewUrl=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  const frame=$('#out iframe'); if(frame) frame.srcdoc=svgPreviewDocument(svg);
}
function setExportMode(mode){
  const st=ensureExportState();
  if(st.source!=='bitmap' || !st.vectorSvg) return;
  st.exportMode=(mode==='vector' || !st.fidelitySvg) ? 'vector' : 'fidelity';
  if(st.exportMode==='fidelity'){
    st.font='original';
    const font=$('#exportFont'); if(font) font.value='original';
  }
  st.baseSvg=st.exportMode==='fidelity' ? st.fidelitySvg : st.vectorSvg;
  const selected=$('#exportMode'); if(selected) selected.value=st.exportMode;
  applyExportFont(st.font||'original');
}

/* ---------- PPTX ----------
   Native shapes and real text boxes, positioned from the measured scene, so the
   result is editable in PowerPoint without any redrawing step and the labels are
   the exact strings from the SVG. */
let pptxLibPromise = null;
function loadPptxGenJS(){
  if(window.PptxGenJS) return Promise.resolve(window.PptxGenJS);
  if(!pptxLibPromise){
    pptxLibPromise = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      // The bundle build is used, not pptxgen.min.js: the minified file expects an
      // external JSZip, so loading it throws and never sets the global.
      s.src = 'vendor/pptxgen.bundle.js';
      s.onload = ()=> window.PptxGenJS ? resolve(window.PptxGenJS) : reject(new Error('PPTX library loaded but global missing'));
      s.onerror = ()=> reject(new Error('PPTX library could not be loaded (vendor/pptxgen.bundle.js)'));
      document.head.appendChild(s);
    });
  }
  return pptxLibPromise;
}

function pptxColor(hex){
  const s=String(hex==null?'':hex).trim();
  if(!s || s==='none' || s==='transparent') return null;
  return s.replace(/^#/,'').toUpperCase();
}

function buildPptx(scene){
  const rawCanvas = scene.canvas || {};
  const canvas = {
    width: Number(rawCanvas.width || rawCanvas.w || EXPORT_CANVAS.w),
    height: Number(rawCanvas.height || rawCanvas.h || EXPORT_CANVAS.h),
  };
  const scale = 10 / canvas.width;                    // canvas units -> inches (10in wide)
  const slideW = 13.333, slideH = 7.5;
  const offX = (slideW - canvas.width*scale) / 2;
  const offY = (slideH - canvas.height*scale) / 2;
  const IN = v => v*scale;
  const pt = v => Math.max(1, Number(v||0) * PT_PER_UNIT);

  return loadPptxGenJS().then(function(PptxGenJS){
    const pres = new PptxGenJS();
    pres.defineLayout({ name:'FF169', width:slideW, height:slideH });
    pres.layout = 'FF169';
    const slide = pres.addSlide();
    slide.background = { color:'FFFFFF' };

    // background: only a full-canvas rect, so the slide is not over-painted
    scene.nodes.forEach(function(n){
      if(n.type!=='rect') return;
      if(n.fill) slide.addShape(pres.ShapeType.rect, { x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.w), h:IN(n.h), fill:{color:pptxColor(n.fill)} });
    });

    scene.nodes.forEach(function(n){
      if(n.type==='rect'){
        if(n.fill) return;                              // already painted as background
        const opts = { x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.w), h:IN(n.h),
                       fill:{ color:'FFFFFF', transparency:100 },
                       line:{ color:pptxColor(n.stroke)||'000000', width:pt(n.strokeWidth||1) } };
        if(n.radius>0){
          opts.rectRadius = Math.min(0.5, (n.radius/canvas.width)/scale*0.01 || 0.08);
          slide.addShape(pres.ShapeType.roundRect, opts);
        } else slide.addShape(pres.ShapeType.rect, opts);
        return;
      }
      if(n.type==='ellipse'){
        slide.addShape(pres.ShapeType.ellipse, {
          x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.w), h:IN(n.h),
          fill:n.fill?{color:pptxColor(n.fill)}:{color:'FFFFFF',transparency:100},
          line:{ color:pptxColor(n.stroke)||'000000', width:pt(n.strokeWidth||1) } });
        return;
      }
      if(n.type==='line'){
        const lineOpts = { x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.x2-n.x), h:IN(n.y2-n.y),
                           line:{ color:pptxColor(n.stroke)||'000000', width:pt(n.strokeWidth||1), beginArrowType:'none', endArrowType:n.arrow?'triangle':'none' } };
        if(Math.abs(n.y2-n.y) < 0.75) lineOpts.line.dashType = 'solid';
        slide.addShape(pres.ShapeType.line, lineOpts);
        return;
      }
      if(n.type==='path' || n.type==='polyline'){
        // Keep freeform geometry where it can be expressed; otherwise fall back to
        // a bounded outline so the element is still present and positionable.
        if(n.points){
          try{
            const raw = n.points.trim().split(/[\s,]+/).map(Number);
            const pts = [];
            for(let i=0;i+1<raw.length;i+=2) pts.push({x:offX+IN(raw[i]), y:offY+IN(raw[i+1])});
            if(pts.length>=2){
              slide.addShape(pres.ShapeType.custGeom ? pres.ShapeType.custGeom : pres.ShapeType.rect,
                { x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.w), h:IN(n.h),
                  fill:n.fill?{color:pptxColor(n.fill)}:{color:'FFFFFF',transparency:100},
                  line:{ color:pptxColor(n.stroke)||'000000', width:pt(n.strokeWidth||1) },
                  points:pts });
              return;
            }
          }catch(_){ /* fall through to outline */ }
        }
        slide.addShape(pres.ShapeType.rect, {
          x:offX+IN(n.x), y:offY+IN(n.y), w:Math.max(IN(n.w),0.02), h:Math.max(IN(n.h),0.02),
          fill:{ color:'FFFFFF', transparency:100 },
          line:{ color:'BFBFBF', width:0.75, dashType:'dash' } });
        return;
      }
      if(n.type==='image'){
        const uri = n.href||'';
        const m = uri.match(/^data:([^;]+);base64,(.*)$/);
        if(m){
          slide.addImage({ data:'data:'+m[1]+';base64,'+m[2], x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.w), h:IN(n.h) });
        }
        return;
      }
      if(n.type==='text'){
        const fontUnits = n.fontSize || 16;
        const boxW = Math.max(IN(n.w) + 0.06, 0.1);
        const lineCount=String(n.text).split(/\r?\n/).length;
        const boxH = Math.max(IN(lineCount>1 ? Math.max(Number(n.h)||0,fontUnits*(lineCount*1.14+.3)) : fontUnits*1.45), 0.12);
        let left;
        if(n.anchor==='middle') left = offX + IN(n.x) - boxW/2;
        else if(n.anchor==='end') left = offX + IN(n.x) - boxW;
        else left = offX + IN(n.x);
        const top = lineCount>1 ? offY+IN(n.y) : offY+IN(n.y)-boxH/2;
        slide.addText(String(n.text), {
          x:left, y:top, w:boxW, h:boxH,
          align:'center', valign:lineCount>1?'top':'middle', margin:0,
          fontFace: n.fontFamily ? String(n.fontFamily).split(',')[0].replace(/["']/g,'') : 'Arial',
          fontSize: Math.max(4, fontUnits*PT_PER_UNIT),
          bold: !!n.bold, italic: !!n.italic,
          color: pptxColor(n.fill) || '000000',
          wrap:false, shrinkText:false, isTextBox:true,
        });
        return;
      }
    });

    return pres.write({ outputType:'blob', compression:true });
  });
}

function exportColor(value, fallback){
  const s=String(value==null?'':value).trim();
  if(!s || s==='none' || s==='transparent') return fallback || 'none';
  return s.replace(/^#/,'');
}
function drawioColor(value, fallback){
  const c=exportColor(value,fallback);
  return c==='none' ? 'none' : '#'+c;
}
function encodeDrawioStencil(stencil){
  // draw.io's Graph.decompress expects URI-encoded XML in a raw DEFLATE
  // stream. Stored DEFLATE blocks keep this dependency-free in the browser.
  const source=new TextEncoder().encode(encodeURIComponent(stencil));
  const blocks=[];
  for(let offset=0;offset<source.length;){
    const count=Math.min(65535,source.length-offset);
    const block=new Uint8Array(5+count);
    block[0]=offset+count===source.length?1:0;
    block[1]=count&255; block[2]=count>>8;
    block[3]=~count&255; block[4]=(~count>>8)&255;
    block.set(source.subarray(offset,offset+count),5);
    blocks.push(block);
    offset+=count;
  }
  let binary='';
  for(const block of blocks){
    for(let offset=0;offset<block.length;offset+=8192)
      binary+=String.fromCharCode(...block.subarray(offset,offset+8192));
  }
  return btoa(binary);
}

/* ---------- draw.io ----------
   Emits real mxCell geometry, not an embedded picture, so every box and label is
   individually editable inside draw.io. This file can also be exported to VSDX
   from draw.io, which is the supported path to Visio. */
function sceneToDrawio(scene){
  scene=expandEditableTextPaths(scene);
  const rawCanvas = scene.canvas || {};
  const c = Object.assign({}, rawCanvas, {
    width: Number(rawCanvas.width || rawCanvas.w || EXPORT_CANVAS.w),
    height: Number(rawCanvas.height || rawCanvas.h || EXPORT_CANVAS.h),
  });
  const cells = [];
  let seq = 10;
  const nextId = ()=> 'ff' + (seq++);
  const xml = s => xmlEscape(s);

  scene.nodes.forEach(function(n){
    if(n.export===false) return;
    const id = nextId();
    if(n.type==='text'){
      const anchor = n.anchor==='middle' ? 'center' : (n.anchor==='end' ? 'right' : 'left');
      const style = 'text;html=1;strokeColor=none;fillColor=none;align='+anchor+';verticalAlign=top;spacing=0;'+
                    'fontSize='+Math.round(n.fontSize||16)+';fontColor='+drawioColor(n.fill,'000000')+
                    (n.bold?';fontStyle=1':'')+(n.italic?';fontStyle=2':'')+
                    (Number.isFinite(Number(n.rotation))?';rotation='+Number(n.rotation).toFixed(3):'')+';whiteSpace=wrap;';
      const w = Math.max(n.w, 8), h = Math.max(n.h, (n.fontSize||16)*1.2, 8);
      const x = n.x;
      cells.push('<mxCell id="'+id+'" value="'+xml(n.text)+'" style="'+style+'" vertex="1" parent="1">'+
                 '<mxGeometry x="'+Math.round(x)+'" y="'+Math.round(n.y)+'" width="'+Math.round(w)+'" height="'+Math.round(h)+'" as="geometry"/></mxCell>');
      return;
    }
    if(n.type==='line'){
      const style = 'endArrow='+(n.arrow?'classic':'none')+';html=1;strokeColor='+drawioColor(n.stroke,scene.svgSource?'none':'000000')+';strokeWidth='+(n.strokeWidth||1)+';'+(n.dash?'dashed=1;':'');
      cells.push('<mxCell id="'+id+'" style="'+style+'" edge="1" parent="1">'+
                 '<mxGeometry relative="1" as="geometry"><mxPoint x="'+Math.round(n.x)+'" y="'+Math.round(n.y)+'" as="sourcePoint"/>'+
                 '<mxPoint x="'+Math.round(n.x2)+'" y="'+Math.round(n.y2)+'" as="targetPoint"/></mxGeometry></mxCell>');
      return;
    }
    if(n.type==='ellipse'){
      const style = 'ellipse;whiteSpace=wrap;html=1;fillColor='+drawioColor(n.fill,'none')+';strokeColor='+drawioColor(n.stroke,scene.svgSource?'none':'000000')+';strokeWidth='+(n.strokeWidth||1)+';'+(n.dash?'dashed=1;':'');
      cells.push('<mxCell id="'+id+'" style="'+style+'" vertex="1" parent="1">'+
                 '<mxGeometry x="'+Math.round(n.x)+'" y="'+Math.round(n.y)+'" width="'+Math.round(n.w)+'" height="'+Math.round(n.h)+'" as="geometry"/></mxCell>');
      return;
    }
    if(n.type==='rect'){
      // mxRectangleShape uses arcSize / 2 as the radius in absolute mode.
      // Preserve measured small/fractional corners instead of imposing a percentage floor.
      const radius=Math.max(0,Math.min(Number(n.radius)||0,n.w/2,n.h/2));
      const rounded = radius>0 ? 'rounded=1;absoluteArcSize=1;arcSize='+(radius*2)+';' : 'rounded=0;';
      const style = rounded+'whiteSpace=wrap;html=1;fillColor='+drawioColor(n.fill,'none')+';strokeColor='+drawioColor(n.stroke,'none')+';strokeWidth='+(n.strokeWidth||1)+';'+(n.dash?'dashed=1;':'');
      cells.push('<mxCell id="'+id+'" style="'+style+'" vertex="1" parent="1">'+
                 '<mxGeometry x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" as="geometry"/></mxCell>');
      return;
    }
    if(n.type==='path' || n.type==='polyline'){
      const segments=geometrySegments(n), points=segments.flatMap(s=>s.points);
      if(!points.length) return;
      const minX=Math.min(...points.map(p=>p.x)), minY=Math.min(...points.map(p=>p.y));
      const maxX=Math.max(...points.map(p=>p.x)), maxY=Math.max(...points.map(p=>p.y));
      const bw=Math.max(1,maxX-minX), bh=Math.max(1,maxY-minY);
      const pathXml=segments.map(s=>'<path><move x="'+((s.points[0].x-minX)/bw*100).toFixed(4)+'" y="'+((s.points[0].y-minY)/bh*100).toFixed(4)+'"/>'+s.points.slice(1).map(p=>'<line x="'+((p.x-minX)/bw*100).toFixed(4)+'" y="'+((p.y-minY)/bh*100).toFixed(4)+'"/>').join('')+(s.closed?'<close/>':'')+'</path>'+(s.closed&&n.fill&&n.fill!=='none'?'<fillstroke/>':'<stroke/>')).join('');
      const stencil='<shape name="超级AI绘图 Path" w="100" h="100" aspect="variable" strokewidth="inherit"><foreground>'+pathXml+'</foreground></shape>';
      const style = 'shape=stencil('+encodeDrawioStencil(stencil)+');whiteSpace=wrap;html=1;fillColor='+drawioColor(n.fill,'none')+';strokeColor='+drawioColor(n.stroke,scene.svgSource?'none':'000000')+';strokeWidth='+(n.strokeWidth||1)+';'+(n.dash?'dashed=1;':'');
      cells.push('<mxCell id="'+id+'" value="" style="'+style+'" vertex="1" parent="1">'+
                 '<mxGeometry x="'+minX.toFixed(3)+'" y="'+minY.toFixed(3)+'" width="'+bw.toFixed(3)+'" height="'+bh.toFixed(3)+'" as="geometry"/></mxCell>');
      return;
    }
    if(n.type==='image'){
      const style = 'shape=image;imageAspect=0;aspect=fixed;image='+xmlEscape(n.href||'')+';';
      cells.push('<mxCell id="'+id+'" style="'+style+'" vertex="1" parent="1">'+
                 '<mxGeometry x="'+Math.round(n.x)+'" y="'+Math.round(n.y)+'" width="'+Math.round(n.w)+'" height="'+Math.round(n.h)+'" as="geometry"/></mxCell>');
      return;
    }
  });

  return '<?xml version="1.0" encoding="UTF-8"?>\n'+
    '<mxfile host="app.diagrams.net" agent="超级AI绘图" type="device">'+
    '<diagram id="figureforge" name="超级AI绘图">'+
    '<mxGraphModel dx="1600" dy="900" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="'+c.width+'" pageHeight="'+c.height+'" math="0" shadow="0">'+
    '<root><mxCell id="0"/><mxCell id="1" parent="0"/>'+cells.join('')+'</root>'+
    '</mxGraphModel></diagram></mxfile>';
}

/* ---------- VSDX ----------
   Native Visio geometry, text and bitmap parts on a ten-inch page. Each visible
   face of a prism remains its own editable shape. */
function sceneToVsdxFiles(scene, font){
  scene=expandEditableTextPaths(scene);
  const imageNodes = (scene && Array.isArray(scene.nodes)) ? scene.nodes.filter(n=>n && n.type==='image') : [];
  const canvasAudit = (scene && scene.canvas) || {};
  const canvasAreaAudit = Math.max(1, Number(canvasAudit.width||canvasAudit.w||EXPORT_CANVAS.w) * Number(canvasAudit.height||canvasAudit.h||EXPORT_CANVAS.h));
  if(imageNodes.some(n=>!/^data:image\//i.test(String(n.href||'')))) throw new Error('VSDX export requires cropped image parts; reconstruct again');
  if(imageNodes.some(n=>Number(n.w||0)*Number(n.h||0) > canvasAreaAudit*0.55)) throw new Error('VSDX export blocked: reconstruction still contains a dominant full-canvas bitmap');
  const rawCanvas = scene.canvas || {};
  const c = Object.assign({}, rawCanvas, {
    width: Number(rawCanvas.width || rawCanvas.w || EXPORT_CANVAS.w),
    height: Number(rawCanvas.height || rawCanvas.h || EXPORT_CANVAS.h),
  });
  const PX_PER_IN = c.width/10;                    // keep the same 10in width as PPTX
  const inches = v => (v/PX_PER_IN);
  const shapes = [];
  const media = [];                                // {name, bytes, contentType, ext}
  const mediaRels = [];                            // relationship entries for page1
  let mediaSeq = 0;

  function geometrySection(points, closed, filled){
    const rows = points.map((p,i)=>'<Row T="'+(i?'RelLineTo':'RelMoveTo')+'" IX="'+(i+1)+'"><Cell N="X" V="'+p[0].toFixed(6)+'"/><Cell N="Y" V="'+p[1].toFixed(6)+'"/></Row>');
    if(closed) rows.push('<Row T="RelLineTo" IX="'+(points.length+1)+'"><Cell N="X" V="'+points[0][0].toFixed(6)+'"/><Cell N="Y" V="'+points[0][1].toFixed(6)+'"/></Row>');
    return '<Section N="Geometry" IX="0"><Cell N="NoFill" V="'+(filled?0:1)+'"/><Cell N="NoLine" V="0"/>'+rows.join('')+'</Section>';
  }

  function boxGeometry(type, radius, w, h){
    if(type==='ellipse') return geometrySection(Array.from({length:48},(_,i)=>{
      const a=2*Math.PI*i/48; return [0.5+0.5*Math.cos(a),0.5+0.5*Math.sin(a)];
    }), true, true);
    const r=Math.max(0,Math.min(Number(radius)||0,w/2,h/2));
    if(!r) return geometrySection([[0,0],[1,0],[1,1],[0,1]],true,true);
    const rx=r/w, ry=r/h, points=[];
    for(const [cx,cy,a0] of [[1-rx,ry,-Math.PI/2],[1-rx,1-ry,0],[rx,1-ry,Math.PI/2],[rx,ry,Math.PI]]){
      for(let j=0;j<=6;j++){
        const a=a0+j*Math.PI/12; points.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);
      }
    }
    return geometrySection(points,true,true);
  }

  function dataUriParts(uri){
    const m = /^data:(image\/(png|jpeg|jpg|gif|webp));base64,([A-Za-z0-9+/=\s]+)$/.exec(String(uri||'').trim());
    if(!m) return null;
    const mime = m[1].toLowerCase();
    const ext = mime === 'image/jpeg' || mime === 'image/jpg' ? 'jpeg' : mime.split('/')[1];
    let bin;
    try{ bin = atob(m[3].replace(/\s+/g,'')); }
    catch(_){ return null; }
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return { bytes, contentType:mime, ext };
  }

  /* Visio stores a bitmap shape as Type="Foreign" with a rectangle geometry, the
     Img* cells, and a <ForeignData> that points at a media part through a page
     relationship. This mirrors the structure Visio itself writes. */
  function imageShape(n, ID, parts, relId){
    const w = Math.max(n.w, 1), h = Math.max(n.h, 1);
    const iw = inches(w), ih = inches(h);
    return '<Shape ID="'+ID+'" Type="Foreign" LineStyle="0" FillStyle="0" TextStyle="0">'+
      '<Cell N="PinX" V="'+inches(n.x + w/2).toFixed(4)+'"/>'+
      '<Cell N="PinY" V="'+inches(c.height - (n.y + h/2)).toFixed(4)+'"/>'+
      '<Cell N="Width" V="'+iw.toFixed(4)+'" U="IN"/><Cell N="Height" V="'+ih.toFixed(4)+'" U="IN"/>'+
      '<Cell N="LocPinX" V="'+(iw/2).toFixed(4)+'" U="IN" F="Width*0.5"/>'+
      '<Cell N="LocPinY" V="'+(ih/2).toFixed(4)+'" U="IN" F="Height*0.5"/>'+
      '<Cell N="Angle" V="0"/><Cell N="FlipX" V="0"/><Cell N="FlipY" V="0"/><Cell N="ResizeMode" V="0"/>'+
      '<Cell N="LinePattern" V="0"/><Cell N="LineWeight" V="0"/><Cell N="FillPattern" V="0"/>'+
      '<Cell N="ImgOffsetX" V="0" U="IN" F="ImgWidth*0"/><Cell N="ImgOffsetY" V="0" U="IN" F="ImgHeight*0"/>'+
      '<Cell N="ImgWidth" V="'+iw.toFixed(4)+'" U="IN" F="Width*1"/>'+
      '<Cell N="ImgHeight" V="'+ih.toFixed(4)+'" U="IN" F="Height*1"/>'+
      '<Cell N="ClippingPath" V="" F="&quot;&quot;" E="#N/A"/>'+
      '<Cell N="TxtPinX" V="'+(iw/2).toFixed(4)+'" U="IN" F="Width*0.5"/>'+
      '<Cell N="TxtPinY" V="0" U="IN" F="Height*0"/>'+
      '<Cell N="TxtWidth" V="'+iw.toFixed(4)+'" U="IN" F="Width*1"/>'+
      '<Cell N="TxtHeight" V="0" U="IN" F="Height*0"/>'+
      '<Cell N="TxtLocPinX" V="'+(iw/2).toFixed(4)+'" U="IN" F="TxtWidth*0.5"/>'+
      '<Cell N="TxtLocPinY" V="0" U="IN" F="TxtHeight*0.5"/>'+
      '<Cell N="TxtAngle" V="0"/><Cell N="VerticalAlign" V="0"/><Cell N="ShdwPattern" V="0"/>'+
      '<Section N="Geometry" IX="0">'+
        '<Cell N="NoFill" V="0"/><Cell N="NoLine" V="1"/><Cell N="NoShow" V="0"/>'+
        '<Cell N="NoSnap" V="0"/><Cell N="NoQuickDrag" V="0"/>'+
        '<Row T="RelMoveTo" IX="1"><Cell N="X" V="0"/><Cell N="Y" V="0"/></Row>'+
        '<Row T="RelLineTo" IX="2"><Cell N="X" V="1"/><Cell N="Y" V="0"/></Row>'+
        '<Row T="RelLineTo" IX="3"><Cell N="X" V="1"/><Cell N="Y" V="1"/></Row>'+
        '<Row T="RelLineTo" IX="4"><Cell N="X" V="0"/><Cell N="Y" V="1"/></Row>'+
        '<Row T="RelLineTo" IX="5"><Cell N="X" V="0"/><Cell N="Y" V="0"/></Row>'+
      '</Section>'+
      '<ForeignData ForeignType="Bitmap" CompressionType="'+parts.ext.toUpperCase()+'"><Rel r:id="'+relId+'"/></ForeignData>'+
      '</Shape>';
  }

  scene.nodes.forEach(function(n, idx){
    if(n.export === false) return;
    const ID = idx+1;
    const st = { fill:(n.fill||'none'), line:(n.stroke||'none'), weight:(n.strokeWidth||0), dash:!!(n.dash) };
    let xml = '';
    if(n.type==='image'){
      const parts = dataUriParts(n.href);
      if(parts){
        mediaSeq++;
        const name = 'image' + mediaSeq + '.' + parts.ext;
        const relId = 'rIdImg' + mediaSeq;
        media.push({ name:'visio/media/'+name, bytes:parts.bytes });
        mediaRels.push({ id:relId, target:'../media/'+name });
        xml = imageShape(n, ID, parts, relId);
      } else {
        // A reference we cannot inline (a remote URL or a path the page cannot read):
        // keep the rectangle correct instead of pretending an image is there.
        xml = '<Shape ID="'+ID+'" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">'+
              '<Cell N="PinX" V="'+inches(n.x+n.w/2).toFixed(4)+'"/><Cell N="PinY" V="'+inches(c.height-(n.y+n.h/2)).toFixed(4)+'"/>'+
              '<Cell N="Width" V="'+inches(Math.max(n.w,4)).toFixed(4)+'"/><Cell N="Height" V="'+inches(Math.max(n.h,4)).toFixed(4)+'"/>'+
              '<Cell N="FillForegnd" V="#F3F4F6"/><Cell N="FillPattern" V="1"/>'+
              '<Cell N="LineColor" V="#9CA3AF"/><Cell N="LinePattern" V="2"/><Cell N="LineWeight" V="0.5"/>'+
              '<Cell N="ShapeType" V="Rectangle"/></Shape>';
      }
    } else if(n.type==='rect' || n.type==='ellipse'){
      const master = n.type==='ellipse' ? 'Ellipse' : 'Rectangle';
      xml = '<Shape ID="'+ID+'" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">'+
            '<Cell N="PinX" V="'+inches(n.x+n.w/2).toFixed(4)+'"/><Cell N="PinY" V="'+inches(c.height-(n.y+n.h/2)).toFixed(4)+'"/>'+
            '<Cell N="Width" V="'+inches(Math.max(n.w,1)).toFixed(4)+'"/><Cell N="Height" V="'+inches(Math.max(n.h,1)).toFixed(4)+'"/>'+
            '<Cell N="LocPinX" V="'+inches(Math.max(n.w,1)/2).toFixed(4)+'"/><Cell N="LocPinY" V="'+inches(Math.max(n.h,1)/2).toFixed(4)+'"/>'+
            fillCells(st)+
            // The geometry already contains the measured corners; do not round it twice.
            '<Cell N="Rounding" V="0"/>'+
            '<Cell N="ShapeType" V="'+master+'"/>'+boxGeometry(n.type,n.radius,n.w,n.h)+
            '</Shape>';
    } else if(n.type==='line'){
      const x1=n.x, y1=n.y, x2=n.x2, y2=n.y2;
      const len = Math.hypot(x2-x1, y2-y1);
      // Visio ShapeSheet Angle values are radians, including when serialized
      // without an explicit unit. Degrees rotate lines to the wrong positions.
      const ang = Math.atan2(-(y2-y1), x2-x1);
      xml = '<Shape ID="'+ID+'" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">'+
            '<Cell N="PinX" V="'+inches((x1+x2)/2).toFixed(4)+'"/><Cell N="PinY" V="'+inches(c.height-(y1+y2)/2).toFixed(4)+'"/>'+
            '<Cell N="Width" V="'+inches(Math.max(len,0.5)).toFixed(4)+'"/><Cell N="Height" V="0"/>'+
            '<Cell N="LocPinX" V="'+inches(Math.max(len,0.5)/2).toFixed(4)+'"/><Cell N="LocPinY" V="0"/>'+
            '<Cell N="Angle" V="'+ang.toFixed(4)+'"/>'+
            '<Cell N="EndArrow" V="'+(n.arrow?4:0)+'"/>'+
            '<Cell N="LineColor" V="#'+exportColor(n.stroke,'000000')+'"/>'+
            '<Cell N="LinePattern" V="'+(n.dash?2:1)+'"/>'+
            '<Cell N="LineWeight" V="'+inches(Math.max(n.strokeWidth||1,1)).toFixed(5)+'"/>'+
            '<Cell N="ShapeType" V="Line"/>'+
            geometrySection([[0,0],[1,0]],false,false)+
            '</Shape>';
    } else if(n.type==='path' || n.type==='polyline'){
      const segments=geometrySegments(n), points=segments.flatMap(s=>s.points);
      if(!points.length) return;
      const minX=Math.min(...points.map(p=>p.x)), minY=Math.min(...points.map(p=>p.y));
      const maxX=Math.max(...points.map(p=>p.x)), maxY=Math.max(...points.map(p=>p.y));
      const bw=Math.max(1,maxX-minX), bh=Math.max(1,maxY-minY);
      let row=1;
      const geometry=segments.map(s=>{
        const rel=p=>'<Cell N="X" V="'+((p.x-minX)/bw).toFixed(6)+'"/><Cell N="Y" V="'+(1-(p.y-minY)/bh).toFixed(6)+'"/>';
        let rows='<Row T="RelMoveTo" IX="'+row+++'">'+rel(s.points[0])+'</Row>';
        for(const p of s.points.slice(1)) rows+='<Row T="RelLineTo" IX="'+row+++'">'+rel(p)+'</Row>';
        if(s.closed) rows+='<Row T="RelLineTo" IX="'+row+++'">'+rel(s.points[0])+'</Row>';
        return rows;
      }).join('');
      xml='<Shape ID="'+ID+'" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">'+
        '<Cell N="PinX" V="'+inches(minX+bw/2).toFixed(4)+'"/><Cell N="PinY" V="'+inches(c.height-(minY+bh/2)).toFixed(4)+'"/>'+
        '<Cell N="Width" V="'+inches(bw).toFixed(4)+'"/><Cell N="Height" V="'+inches(bh).toFixed(4)+'"/>'+
        '<Cell N="LocPinX" V="'+inches(bw/2).toFixed(4)+'"/><Cell N="LocPinY" V="'+inches(bh/2).toFixed(4)+'"/>'+
        fillCells(st)+(scene.svgSource&&n.arrow?'<Cell N="EndArrow" V="4"/>':'')+'<Section N="Geometry" IX="0"><Cell N="NoFill" V="'+(segments.some(s=>s.closed)?0:1)+'"/><Cell N="NoLine" V="0"/>'+geometry+'</Section></Shape>';
    } else if(n.type==='text'){
      const text = String(n.text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      // The Visio page is ten inches wide. SVG font sizes are canvas pixels,
      // so convert through that page scale instead of the PPTX point heuristic.
      // The old multiplier enlarged text by ~1.8x in Visio.
      const fontPx = Math.max(1, Number(n.fontSize)||16);
      const sizePt = fontPx*72/PX_PER_IN;
      // Visio wraps text to the shape's Width even when the SVG/PPTX text is
      // allowed to overhang its measured crop box. Size the native text box
      // from the font metrics as well, while preserving its original anchor.
      const lines = String(n.text).split(/\r?\n/);
      const glyphUnits = Math.max(...lines.map(line => Array.from(line).reduce((sum, ch) =>
        sum + (/[^\x00-\xff]/.test(ch) ? 1 : /[ilI.,:;!| ']/.test(ch) ? 0.3 : /[MW@#%]/.test(ch) ? 0.85 : 0.57), 0)));
      const pxPerPt = PX_PER_IN/72;
      const measuredW = Number.isFinite(Number(n.w)) ? Math.max(0,Number(n.w))*1.04 : 0;
      const boxW = Math.max(measuredW, (glyphUnits+1.2)*sizePt*pxPerPt, 20);
      const boxH = Math.max(fontPx*1.4, lines.length*sizePt*pxPerPt*1.35);
      const anchorX = n.anchor==='middle' ? n.x+Number(n.w||0)/2 :
        n.anchor==='end' ? n.x+Number(n.w||0)-boxW/2 : n.x+boxW/2;
      const anchorY = n.verticalAlign==='middle' ? n.y+Number(n.h||0)/2 : n.y+boxH/2;
      const textAngle=Number.isFinite(Number(n.rotation)) ? -Number(n.rotation)*Math.PI/180 : 0;
      xml = '<Shape ID="'+ID+'" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">'+
            '<Cell N="PinX" V="'+inches(anchorX).toFixed(4)+'"/><Cell N="PinY" V="'+inches(c.height-anchorY).toFixed(4)+'"/>'+
            '<Cell N="Width" V="'+inches(boxW).toFixed(4)+'"/><Cell N="Height" V="'+inches(boxH).toFixed(4)+'"/>'+
            '<Cell N="LocPinX" V="'+inches(boxW/2).toFixed(4)+'"/><Cell N="LocPinY" V="'+inches(boxH/2).toFixed(4)+'"/>'+
            '<Cell N="Angle" V="'+textAngle.toFixed(6)+'"/>'+
            '<Cell N="FillForegnd" V="#FFFFFF"/><Cell N="FillPattern" V="0"/>'+
            '<Cell N="LinePattern" V="0"/>'+
            '<Cell N="VerticalAlign" V="'+(n.verticalAlign==='middle'?1:0)+'"/><Cell N="HorzAlign" V="'+(n.anchor==='middle'?1:(n.anchor==='end'?2:0))+'"/>'+
            '<Cell N="ShapeType" V="Text"/>'+
            '<Section N="Character"><Row IX="0"><Cell N="Size" V="'+(sizePt/72).toFixed(5)+'"/>'+
              '<Cell N="Color" V="#'+exportColor(n.fill,'000000')+'"/><Cell N="Style" V="'+(n.bold?1:0)+'"/>'+
              '<Cell N="Font" V="'+xmlEscape(font||n.fontFamily||'Arial')+'"/></Row></Section>'+
            '<Text>'+text+'</Text>'+
            '</Shape>';
    } else {
      // Unsupported primitive: keep a dashed placeholder so nothing silently vanishes.
      xml = '<Shape ID="'+ID+'" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">'+
            '<Cell N="PinX" V="'+inches(n.x+n.w/2).toFixed(4)+'"/><Cell N="PinY" V="'+inches(c.height-(n.y+n.h/2)).toFixed(4)+'"/>'+
            '<Cell N="Width" V="'+inches(Math.max(n.w,4)).toFixed(4)+'"/><Cell N="Height" V="'+inches(Math.max(n.h,4)).toFixed(4)+'"/>'+
            '<Cell N="FillPattern" V="0"/><Cell N="LinePattern" V="2"/>'+
            '<Cell N="LineColor" V="#BFBFBF"/>'+
            '<Cell N="ShapeType" V="Rectangle"/></Shape>';
    }
    shapes.push(xml);
  });

  function fillCells(st){
    const parts = [];
    parts.push('<Cell N="FillForegnd" V="#'+exportColor(st.fill,'FFFFFF')+'"/>');
    parts.push('<Cell N="FillPattern" V="'+(st.fill && st.fill!=='none' ? 1 : 0)+'"/>');
    parts.push('<Cell N="LineColor" V="#'+exportColor(st.line,'000000')+'"/>');
    parts.push('<Cell N="LinePattern" V="'+(st.line && st.line!=='none' ? (st.dash?2:1) : 0)+'"/>');
    parts.push('<Cell N="LineWeight" V="'+inches(Math.max(st.weight,1)).toFixed(5)+'"/>');
    return parts.join('');
  }

  const pageWidth = inches(c.width).toFixed(4), pageHeight = inches(c.height).toFixed(4);

  // The page part is a PageContents document holding the shapes. The drawing-level
  // VisioDocument, its page list and the page properties live in the other parts.
  const pageXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<PageContents xmlns="http://schemas.microsoft.com/office/visio/2012/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xml:space="preserve">'+
    '<Shapes>'+shapes.join('')+'</Shapes>'+
    '</PageContents>';

  const pageRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    mediaRels.map(r=>'<Relationship Id="'+r.id+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="'+r.target+'"/>').join('')+
    '</Relationships>';

  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    (media.some(m=>/\.png$/i.test(m.name)) ? '<Default Extension="png" ContentType="image/png"/>' : '')+
    (media.some(m=>/\.jpe?g$/i.test(m.name)) ? '<Default Extension="jpeg" ContentType="image/jpeg"/>' : '')+
    (media.some(m=>/\.gif$/i.test(m.name)) ? '<Default Extension="gif" ContentType="image/gif"/>' : '')+
    (media.some(m=>/\.webp$/i.test(m.name)) ? '<Default Extension="webp" ContentType="image/webp"/>' : '')+
    '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>'+
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'+
    '<Override PartName="/visio/document.xml" ContentType="application/vnd.ms-visio.drawing.main+xml"/>'+
    '<Override PartName="/visio/pages/pages.xml" ContentType="application/vnd.ms-visio.pages+xml"/>'+
    '<Override PartName="/visio/pages/page1.xml" ContentType="application/vnd.ms-visio.page+xml"/>'+
    '<Override PartName="/visio/windows.xml" ContentType="application/vnd.ms-visio.windows+xml"/>'+
    '</Types>';

  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.microsoft.com/visio/2010/relationships/document" Target="visio/document.xml"/>'+
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>'+
    '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'+
    '</Relationships>';

  const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.microsoft.com/visio/2010/relationships/pages" Target="pages/pages.xml"/>'+
