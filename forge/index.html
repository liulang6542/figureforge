/* ---------- zip (stored, no compression) ----------
   VSDX is an OOXML package, so a minimal store-only zip writer is enough and
   keeps this dependency-free. CRC32 is required by the format. */
function crc32(bytes){
  let table = crc32.table;
  if(!table){
    table = crc32.table = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function zipStore(files){
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours()<<11) | (now.getMinutes()<<5) | Math.floor(now.getSeconds()/2)) & 0xFFFF;
  const dosDate = (((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate()) & 0xFFFF;

  files.forEach(function(f){
    const nameBytes = enc.encode(f.name);
    const dataBytes = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(dataBytes);
    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0, true);
    lv.setUint16(8, 0, true);            // stored
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, dataBytes.length, true);
    lv.setUint32(22, dataBytes.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    chunks.push(local, dataBytes);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, dataBytes.length, true);
    cv.setUint32(24, dataBytes.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);

    offset += local.length + dataBytes.length;
  });

  const centralSize = central.reduce((a,c)=>a+c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  return new Blob(chunks.concat(central, [end]), { type:'application/vnd.ms-visio.drawing' });
}

/* ---------- text-free base -> editable scene ----------
   The image model is asked to draw the figure with empty label areas, because a
   model that paints letters as pictures is what produces garbled labels. Here the
   label boxes are found by local pixel analysis (no API), the wording is taken from
   the paper, and the text is drawn as real SVG <text>. Everything downstream — the
   preview, the geometry audit and the four exporters — then works on real shapes
   and real strings. */
const RECON_SCHEMA = 'figureforge.recon.v2';

function bitmapToDataUrl(src){
  return /^data:image\//.test(String(src||'')) ? String(src) : null;
}

function loadImage(dataUrl){
  return new Promise(function(resolve, reject){
    const im = new Image();
    im.onload = function(){ resolve(im); };
    im.onerror = function(){ reject(new Error('image decode failed')); };
    im.src = dataUrl;
  });
}

/* Flood fill the light pixels and keep regions that are large, bounded and roughly
   rectangular. Empty label areas come out as single regions with a high fill ratio;
   areas holding an illustration come out with a lower one. */
/* Find label anchors by looking at content rather than at blank boxes.
   A blank box is only detectable when a dark border encloses it, which is exactly
   what the layered layout avoids: boxes are packed and the reserved bands are open to
   the background. So instead: find the content blocks, then anchor a label in the
   blank band above and below each block. */
function detectContentBlocks(canvas){
  const w = canvas.width, h = canvas.height;
  const img = canvas.getContext('2d', { willReadFrequently:true }).getImageData(0,0,w,h).data;
  const N = w*h;
  const isContent = function(i){
    const o = i*4, r = img[o], g = img[o+1], b = img[o+2];
    // anything that is not near-white counts as content
    return !(r > 228 && g > 228 && b > 228);
  };
  const seen = new Uint8Array(N);
  const blocks = [];
  const stack = [];
  const minPixels = Math.max(400, Math.round(N * 0.0004));
  for(let start = 0; start < N; start++){
    if(seen[start] || !isContent(start)) continue;
    stack.length = 0; stack.push(start); seen[start] = 1;
    let count = 0, minX = w, maxX = -1, minY = h, maxY = -1;
    while(stack.length){
      const p = stack.pop();
      const x = p % w, y = (p - x) / w;
      count++;
      if(x < minX) minX = x;
      if(x > maxX) maxX = x;
      if(y < minY) minY = y;
      if(y > maxY) maxY = y;
      if(x > 0   && !seen[p-1] && isContent(p-1)){ seen[p-1] = 1; stack.push(p-1); }
      if(x < w-1 && !seen[p+1] && isContent(p+1)){ seen[p+1] = 1; stack.push(p+1); }
      if(y > 0   && !seen[p-w] && isContent(p-w)){ seen[p-w] = 1; stack.push(p-w); }
      if(y < h-1 && !seen[p+w] && isContent(p+w)){ seen[p+w] = 1; stack.push(p+w); }
    }
    if(count < minPixels) continue;
    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    if(bw < 30 || bh < 20) continue;
    if(bw > w * 0.95 && bh > h * 0.95) continue;   // the page frame itself
    blocks.push({ x:minX, y:minY, w:bw, h:bh, area:count });
  }
  return blocks;
}

/* Turn content blocks into candidate label anchors: the blank band directly under a
   block (a box label) and the blank band directly above it (often a panel title). */
function labelAnchorsFromBlocks(blocks, w, h){
  const anchors = [];
  blocks.forEach(function(b){
    const below = { x:b.x, y:b.y + b.h + 4, w:b.w, h:Math.max(22, Math.min(38, Math.round(b.h * 0.16))) };
    if(below.y + below.h < h - 2) anchors.push(below);
    const above = { x:b.x, y:b.y - Math.max(22, Math.min(38, Math.round(b.h * 0.16))) - 4,
                    w:b.w, h:Math.max(22, Math.min(38, Math.round(b.h * 0.16))) };
    if(above.y > 2) anchors.push(above);
  });
  return anchors;
}

/* Slide a label box to the nearest position whose pixels are actually blank, so text
   never sits on top of an illustration. Returns the adjusted box, or the input when no
   blank spot is within reach. */
function snapToBlankPixels(canvas, box){
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d', { willReadFrequently:true });
  const bw = Math.max(20, Math.round(box.w)), bh = Math.max(16, Math.round(box.h));
  const maxShift = 46;
  const blankRatio = function(x0, y0){
    const x = Math.max(0, Math.min(w - 1, Math.round(x0)));
    const y = Math.max(0, Math.min(h - 1, Math.round(y0)));
    const cw = Math.min(bw, w - x), ch = Math.min(bh, h - y);
    if(cw < 6 || ch < 6) return -1;
    const d = ctx.getImageData(x, y, cw, ch).data;
    let light = 0, total = cw * ch;
    for(let i = 0; i < total; i++){
      const o = i*4;
      if(d[o] > 228 && d[o+1] > 228 && d[o+2] > 228) light++;
    }
    return light / total;
  };
  let best = null, bestScore = -1;
  for(let dy = -maxShift; dy <= maxShift; dy += 6){
    for(let dx = -maxShift; dx <= maxShift; dx += 6){
      const ratio = blankRatio(box.x + dx, box.y + dy);
      if(ratio < 0) continue;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const score = ratio - dist / (maxShift * 12);
      if(score > bestScore){ bestScore = score; best = { x:box.x + dx, y:box.y + dy }; }
    }
  }
  if(!best) return box;
  return { x:best.x, y:best.y, w:bw, h:bh };
}

/* Which wording goes in which box is decided by position, because the wording comes
   from the paper, not from a model reading the pixels. The vision model only names
   the regions it was shown, in order. */
function assignLabelsToRegions(regions, labels){
  const boxes = regions.slice(0, labels.length);
  const sorted = boxes.slice().sort(function(a,b){
    if(Math.abs(a.y - b.y) > 60) return a.y - b.y;
    return a.x - b.x;
  });
  return sorted.map(function(r, i){
    return { region:r, text:(labels[i]==null ? '' : String(labels[i])).trim() };
  }).filter(function(x){ return x.text; });
}

function reconPrompt(n){
  return 'You are given ' + n + ' blank label areas detected in a scientific figure, in reading order '
    + '(left to right, top to bottom). Each entry gives its position, in pixels, on a 1600x900 canvas. '
    + 'For EACH area, decide the short English label (1-4 words) that belongs there, judged from the '
    + 'paper content and from that area position relative to the figure. '
    + 'Use wording that appears in the paper; never invent unrelated terms. '
    + 'A blank area at the very top of a panel is usually a panel title (2-4 words, capitalised). '
    + 'A narrow blank area just under a box is that box label. '
    + 'Return STRICT JSON only, no commentary: '
    + '{"labels":[{"text":"Input Encoder","x":0,"y":0,"w":0,"h":0}]} '
    + 'with exactly ' + n + ' entries, in the same order as given. '
    + 'x/y/w/h are your best estimate in pixels on the 1600x900 canvas; a rough estimate is enough.';
}

/* Build a scene whose shapes carry the base bitmap and whose text is real text. */
function buildReconScene(baseCanvas, placed, paperText){
  const W = baseCanvas.width, H = baseCanvas.height;
  const nodes = [];
  nodes.push({ id:'bg', type:'image', x:0, y:0, w:W, h:H, href: baseCanvas.toDataURL('image/png') });
  placed.forEach(function(item, i){
    const r = item.region;
    // a text box anchored at the top-left of the detected area, with a little padding
    const pad = 4;
    const fontSize = Math.max(14, Math.min(34, Math.round(r.h * 0.26)));
    nodes.push({
      id: 'label' + (i+1),
      type: 'text',
      x: r.x + pad,
      y: r.y + pad + fontSize,
      w: Math.max(r.w - pad*2, 20),
      h: fontSize * 1.35,
      text: item.text,
      fontSize: fontSize,
      fill: '111827',
      anchor: 'start',
      bold: false,
    });
  });
  return { schema:'figureforge.scene.v3', canvas:{ width:W, height:H, w:W, h:H },
           nodes:nodes, counts:{ shapes:1, text:placed.length } };
}

function sceneToSvgString(scene){
  scene=expandEditableTextPaths(scene);
  const raw = scene.canvas || {};
  const W = Number(raw.width || raw.w || EXPORT_CANVAS.w), H = Number(raw.height || raw.h || EXPORT_CANVAS.h);
  const color = function(v, fallback){
    const s = String(v == null ? '' : v).trim();
    if(/^[a-f0-9]{6}$/i.test(s)) return '#'+s;
    if(!s || s === 'none' || s === 'transparent') return s || (fallback || 'none');
    return (/^#|^rgb\(|^rgba\(|^hsl\(|^hsla\(|^[a-z]+$/i.test(s)) ? s : ('#' + s);
  };
  const num = function(v, d){ const n = Number(v); return Number.isFinite(n) ? n : (d || 0); };
  const parts = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" ' +
    'viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">',
    '<defs><marker id="ff-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs>',
    '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"/>'];
  (scene.nodes || []).forEach(function(n, i){
    if(n.export === false) return;
    const id = escapeSvgAttr(n.id || ('n' + i));
    const x=num(n.x), y=num(n.y), w=Math.max(0,num(n.w)), h=Math.max(0,num(n.h));
    const stroke = color(n.stroke, 'none');let fill = color(n.fill, 'none');
    if(n.gradient?.stops?.length>=2){const a=Number(n.gradient.angle||0)*Math.PI/180,dx=Math.cos(a)*50,dy=Math.sin(a)*50;
      parts.push('<defs><linearGradient id="grad'+i+'" x1="'+(50-dx)+'%" y1="'+(50-dy)+'%" x2="'+(50+dx)+'%" y2="'+(50+dy)+'%">'+n.gradient.stops.map(s=>'<stop offset="'+Math.max(0,Math.min(1,Number(s.offset)))*100+'%" stop-color="'+escapeSvgAttr(s.color)+'"/>').join('')+'</linearGradient></defs>');fill='url(#grad'+i+')';}
    if(n.arrow)parts.push('<defs><marker id="arrow'+i+'" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="'+stroke+'"/></marker></defs>');
    if(n.arrowStart)parts.push('<defs><marker id="arrowStart'+i+'" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto"><path d="M8 0L0 4L8 8Z" fill="'+stroke+'"/></marker></defs>');
    const markers=(n.arrow?' marker-end="url(#arrow'+i+')"':'')+(n.arrowStart?' marker-start="url(#arrowStart'+i+')"':'');
    const sw = Math.max(0,num(n.strokeWidth,1));
    const rawDash = n.dash || n.dashed || n.strokeDasharray;
    const dashValues = Array.isArray(rawDash) ? rawDash : typeof rawDash === 'string' ? rawDash.trim().split(/[\s,]+/).map(Number) : null;
    const dash = dashValues?.length && dashValues.every(v=>typeof v==='number' && Number.isFinite(v) && v>=0) && dashValues.some(v=>v>0)
      ? ' stroke-dasharray="'+dashValues.join(' ')+'"' : rawDash===true ? ' stroke-dasharray="8 6"' : '';
    const frame=n.type!=='text'&&num(n.rotation)?editableShapeFrame(n):null;
    if(frame)parts.push('<g transform="rotate('+num(n.rotation)+' '+(frame.x+frame.w/2)+' '+(frame.y+frame.h/2)+')">');
    if(n.type === 'image'){
      parts.push('<image id="'+id+'" data-role="image" data-editable="true" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" preserveAspectRatio="none" href="'+escapeSvgAttr(n.href||'')+'" xlink:href="'+escapeSvgAttr(n.href||'')+'"/>');
    } else if(n.type === 'text'){
      const anchor = n.anchor==='middle' ? 'middle' : (n.anchor==='end' ? 'end' : 'start');
      const tx = anchor==='middle' ? x+w/2 : anchor==='end' ? x+w : x;
      const fitted=scene.svgSource ? {text:String(n.text||''),fontSize:Math.max(1,num(n.fontSize,16))} : layoutEditableText(n.text,{...n,fontSize:num(n.fontSize,16)});
      const fs=fitted.fontSize, lines=fitted.text.split(/\r?\n/), lineH=fs*1.14;
      const measuredBaseline=scene.svgSource&&Number.isFinite(Number(n.baselineRatio));
      const ty=measuredBaseline ? y+Number(n.baselineRatio)*h :
        (n.verticalAlign==='middle' ? y+(h-lines.length*lineH)/2+fs*.86 : y+fs*.84);
      const rotation=Number.isFinite(Number(n.rotation))&&Number(n.rotation)!==0?' transform="rotate('+num(n.rotation)+' '+(x+w/2)+' '+(y+h/2)+')"':'';
      parts.push('<text id="'+id+'" data-role="label" data-editable="true" x="'+tx+'" y="'+ty+'" text-anchor="'+anchor+'"'+rotation+' font-family="'+escapeSvgAttr(n.fontFamily||'Arial, Helvetica, sans-serif')+'" font-size="'+fs+'" fill="'+color(n.fill,'#111827')+'"'+(n.bold?' font-weight="bold"':'')+(n.italic?' font-style="italic"':'')+'>'+lines.map((line,j)=>'<tspan x="'+tx+'" dy="'+(j?lineH:0)+'">'+xmlEscape(line)+'</tspan>').join('')+'</text>');
    } else if(n.type === 'rect'){
      parts.push('<rect id="'+id+'" data-editable="true" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+Math.max(0,num(n.radius))+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"'+dash+'/>');
    } else if(n.type === 'ellipse'){
      parts.push('<ellipse id="'+id+'" data-editable="true" cx="'+(x+w/2)+'" cy="'+(y+h/2)+'" rx="'+(w/2)+'" ry="'+(h/2)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"'+dash+'/>');
    } else if(n.type === 'line'){
      parts.push('<line id="'+id+'" data-editable="true" x1="'+x+'" y1="'+y+'" x2="'+num(n.x2,x+w)+'" y2="'+num(n.y2,y+h)+'" stroke="'+color(n.stroke,'#334155')+'" stroke-width="'+sw+'" fill="none"'+markers+dash+'/>');
    } else if(n.type === 'polyline'){
      parts.push('<'+(n.closed?'polygon':'polyline')+' id="'+id+'" data-editable="true" points="'+escapeSvgAttr(n.points||'')+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"'+markers+dash+'/>');
    } else if(n.type === 'path'){
      parts.push('<path id="'+id+'" data-editable="true" d="'+escapeSvgAttr(n.d||'')+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"'+markers+dash+'/>');
    }
    if(frame)parts.push('</g>');
  });
  parts.push('</svg>');
  return parts.join('\n');
}

// Render the actual editable SVG before accepting it. This measures visible
// error against the bitmap, not merely whether the JSON has valid geometry.
async function compareEditableRender(sourceCanvas,scene,region){
  const view=region||{x:0,y:0,w:sourceCanvas.width,h:sourceCanvas.height};
  const scale=Math.min(1,(region?1600:720)/Math.max(view.w,view.h));
  const renderW=Math.max(1,Math.round(view.w*scale));
  const renderH=Math.max(1,Math.round(view.h*scale));
  const ref=document.createElement('canvas'),out=document.createElement('canvas');
  ref.width=out.width=renderW; ref.height=out.height=renderH;
  const rc=ref.getContext('2d',{willReadFrequently:true});
  const oc=out.getContext('2d',{willReadFrequently:true});
  rc.fillStyle=oc.fillStyle='#ffffff';
  rc.fillRect(0,0,renderW,renderH); oc.fillRect(0,0,renderW,renderH);
  rc.drawImage(sourceCanvas,view.x,view.y,view.w,view.h,0,0,renderW,renderH);
  const raster=typeof scene==='string'&&/^data:image\/(png|jpeg|webp);/i.test(scene);
  const url=raster?scene:URL.createObjectURL(new Blob([typeof scene==='string'?scene:sceneToSvgString(scene)],{type:'image/svg+xml'}));
  try{oc.drawImage(await loadImage(url),-view.x*scale,-view.y*scale,sourceCanvas.width*scale,sourceCanvas.height*scale);}
  finally{if(!raster)URL.revokeObjectURL(url);}

      Math.abs(renderGray[p-w]-renderGray[p+w])>36)?1:0;

    weakRegions:weakRegions.slice(0,5),preview:out.toDataURL('image/png')};
}

// Keep the model's shapes and text as individually editable objects, then put
// independently selectable source-image tiles above them for exact appearance.
// A tile is an image object: its internal pixels cannot be edited as shapes.
// The pure-vector mode remains available for users who need every mark native.
function buildFidelityScene(scene, sourceCanvas){
  const W=sourceCanvas.width, H=sourceCanvas.height, tileSize=320;
  const nodes=(scene.nodes||[]).slice(), patches=[];
  for(let y=0;y<H;y+=tileSize){
    for(let x=0;x<W;x+=tileSize){

      // a faint resampling seam; overlapping patches worsens color accuracy.
      const w=Math.min(tileSize,W-x), h=Math.min(tileSize,H-y);
      const crop=document.createElement('canvas');
      crop.width=w; crop.height=h;
      crop.getContext('2d').drawImage(sourceCanvas,x,y,w,h,0,0,w,h);
      patches.push({id:'source-tile-'+patches.length,type:'image',x,y,w,h,
        href:crop.toDataURL('image/png'),role:'fidelity-source-tile'});

  nodes.push(...patches);
  return {schema:'figureforge.scene.v3',canvas:{width:W,height:H,w:W,h:H},nodes,
    counts:Object.assign({},scene.counts||{},{fidelityTiles:patches.length})};
}

async function ensureBitmapDataUrl(src){
  if(!src) return null;
  if(/^data:image\//i.test(String(src))) return String(src);
  const IR = roleRoute('image');
  const r = await fetchBitmapSource(src,{provider:IR.provider,base:IR.base,key:IR.key});
  if(!r.ok) throw new Error('Reference image could not be read');
  return fileToDataURI(await r.blob());
}

// Persist raw -> parsed -> final evidence independently of the volatile export card.
// No credentials or request headers are stored. Failed writes remain downloadable.
let reconArchiveQueue=Promise.resolve();
async function reconArchiveStore(mode,operation){
  const db=await new Promise((resolve,reject)=>{
    const request=indexedDB.open('figure-forge-recognition-evidence',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('runs',{keyPath:'id'});
    request.onerror=()=>reject(request.error);request.onsuccess=()=>resolve(request.result);
  });
  try{return await new Promise((resolve,reject)=>{
    const transaction=db.transaction('runs',mode),request=operation(transaction.objectStore('runs'));
    let result;request.onsuccess=()=>{result=request.result;};
    transaction.oncomplete=()=>resolve(result);transaction.onerror=transaction.onabort=()=>reject(transaction.error||Error('Evidence transaction aborted'));
  });}finally{db.close();}
}
function persistReconArchive(update={}){
  const archive=window.__ffReconArchive||(window.__ffReconArchive={version:3,id:Date.now()+'-'+crypto.randomUUID(),startedAt:new Date().toISOString(),responses:[]});
  Object.assign(archive,update,{responses:window.__ffReconResponses||[],updatedAt:new Date().toISOString()});
  // Snapshot now: queued writes must never pick up another run's responses.
  const snapshot=JSON.parse(JSON.stringify(archive));
  reconArchiveQueue=reconArchiveQueue.then(async()=>{
    try{await reconArchiveStore('readwrite',store=>store.put(snapshot));window.__ffLatestReconArchive=snapshot;delete archive.persistenceError;}
    catch(error){archive.persistenceError=String(error.message||error);console.warn('Recognition evidence could not be persisted',error);const button=$('#downloadReconResponse');if(button)button.title='本地保存失败，请立即下载记录：'+archive.persistenceError;}
  });
  return reconArchiveQueue;
}
async function rememberReconResponse(record){
  record.time??=new Date().toISOString();
  (window.__ffReconResponses||(window.__ffReconResponses=[])).push(record);
  const button=$('#downloadReconResponse');if(button)button.hidden=false;
  await persistReconArchive();
  return record;
}

function editableResponseText(d){
  /* Providers do not agree on the shape of multimodal output.  Ark and some
     OpenAI-compatible relays may return content as nested arrays/objects,
     Responses-style output_text, or a message object.  The old parser only
     handled one Chat Completions shape and silently produced an empty string,
     which was then reported as a reconstruction failure even though Step 3
     had a valid bitmap. */
  const seen=[];
  function walk(v, depth){
    if(v==null || depth>12) return '';
    if(typeof v==='string') return v;
    if(typeof v!=='object') return '';
    if(seen.indexOf(v)>=0) return '';
    seen.push(v);
    if(Array.isArray(v)) return v.map(function(x){ return walk(x,depth+1); }).join('');
    const preferred=['text','output_text','content','message','choices','output'];
    for(let i=0;i<preferred.length;i++){
      const key=preferred[i];
      if(v[key]!==undefined && v[key]!==null){
        const s=walk(v[key],depth+1);
        if(s) return s;
      }
    }
    /* Keep provider reasoning fields as a last resort; they sometimes contain
       the JSON when the visible content field is wrapped by a relay. */
    const fallback=['reasoning_content','reasoning'];
    for(let i=0;i<fallback.length;i++){
      if(v[fallback[i]]!==undefined){
        const s=walk(v[fallback[i]],depth+1);
        if(s) return s;
      }
    }
    return '';
  }
  return walk(d,0) || parseResponseText(d) || '';
}

async function editableRevisionImages(sourceDataUri, revision, W, H){
  if(!revision) return [sourceDataUri];
  const images=[sourceDataUri,revision.preview];
  const weak=(revision.weakRegions||[]).slice(0,2);
  if(!weak.length) return images;
  const [source,render]=await Promise.all([loadImage(sourceDataUri),loadImage(revision.preview)]);
  for(const region of weak){
    const pad=Math.max(8,Math.round(Math.min(region.w,region.h)*.12));
    const x=Math.max(0,Math.floor(region.x-pad)),y=Math.max(0,Math.floor(region.y-pad));
    const right=Math.min(W,Math.ceil(region.x+region.w+pad));
    const bottom=Math.min(H,Math.ceil(region.y+region.h+pad));
    const w=right-x,h=bottom-y;
    if(w<2||h<2) continue;
    for(const image of [source,render]){
      const crop=document.createElement('canvas');
      const zoom=Math.min(3,Math.max(1,640/Math.max(w,h)));
      crop.width=Math.round(w*zoom);crop.height=Math.round(h*zoom);
      const context=crop.getContext('2d');
      context.imageSmoothingEnabled=true;
      context.imageSmoothingQuality='high';
      context.drawImage(image,x,y,w,h,0,0,crop.width,crop.height);
      images.push(crop.toDataURL('image/png'));
    }
  }
  return images;
}

// SVG export fixes from f96ff8b are retained. Release: bitmap-0919a98-svg-f96ff8b.
// Images are already supplied as vision inputs. Never tokenize embedded pixels as catalog text.
function serializeVisionCatalog(catalog){
  return JSON.stringify(catalog,(key,value)=>typeof value==='string'&&value.startsWith('data:image/')?undefined:value);
}
// Transport copies only: the uploaded bitmap, source canvas and export pixels stay intact.
// Count the base64 representation too, leaving room below either interpretation of 10 MB.
const ARK_VISION_IMAGE_BYTES=9500000;
const ARK_VISION_REQUEST_BYTES=60000000;
function visionImageSize(uri){
  const match=/^data:image\/[^;,]+;base64,([\s\S]*)$/.exec(uri);
  if(!match) throw new Error('图片发送检查失败：需要有效的 Base64 图片。');
  const data=match[1];
  return {bytes:data.length*3/4-(data.endsWith('==')?2:data.endsWith('=')?1:0),base64Bytes:data.length};
}
function checkVisionRequestSize(body,limited){
  const serialized=JSON.stringify(body);
  if(limited && new TextEncoder().encode(serialized).byteLength>=ARK_VISION_REQUEST_BYTES){
    const error=new Error('图片请求总大小超过安全上限（60 MB）；已在发送前停止，未缩小原图，也未重新生成整图。');
    error.imageTransportFailure=true;
    throw error;
  }

}
async function prepareVisionImages(images,limited,signal){
  if(!limited)return {images,transport:[]};
  const results=new Map(),transport=[],prepared=[];
  const checkAbort=()=>{if(signal?.aborted)throw new DOMException('已取消','AbortError');};
  const fits=uri=>{const n=visionImageSize(uri);return n.bytes<ARK_VISION_IMAGE_BYTES&&n.base64Bytes<ARK_VISION_IMAGE_BYTES;};
  for(const [index,source] of images.entries()){
    checkAbort();
    let result=results.get(source);
    if(!result){
      const before=visionImageSize(source);
      result={uri:source,encoding:'original',lossy:false,before};
      if(!fits(source)){
        const image=await loadImage(source);
        checkAbort();
        const canvas=document.createElement('canvas');
        canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
        if(!canvas.width||!canvas.height)throw new Error('图片发送检查失败：无法读取原始像素尺寸。');
        const ctx=canvas.getContext('2d');
        if(!ctx)throw new Error('图片发送检查失败：浏览器无法建立原始尺寸画布。');
        try{
          ctx.drawImage(image,0,0);
          const png=canvas.toDataURL('image/png');

            let accepted=false;
            for(const quality of [0.98,0.95,0.92,0.90]){
              checkAbort();
              const jpeg=canvas.toDataURL('image/jpeg',quality);
              if(jpeg.startsWith('data:image/jpeg;')&&fits(jpeg)){
                result={...result,uri:jpeg,encoding:'jpeg',quality,lossy:true};accepted=true;break;
              }
            }
            if(!accepted)throw new Error('图片 '+(index+1)+' 在保持原始像素尺寸、JPEG 质量不低于 90% 时仍超过服务商上限。已在发送前停止；未缩图或降低模型参数。');
          }
          result.width=canvas.width;result.height=canvas.height;
        }finally{canvas.width=0;canvas.height=0;}
      }
      result.after=visionImageSize(result.uri);
      results.set(source,result);
    }
    prepared.push(result.uri);
    const {uri,...record}=result;
    transport.push({index,...record});
  }

  return {images:prepared,transport};
}
async function appendVisionOverviews(images,signal){
  const overviewImages=[],records=[];
  // Keep all existing image numbers stable (especially ORIGINAL/RENDER pairs).
  // The original remains byte-for-byte intact; this extra view supplies composition.
  for(let index=0;index<Math.min(images.length,2);index++){
    if(signal?.aborted)throw new DOMException('已取消','AbortError');
    const source=await loadImage(images[index]);
    const width=source.naturalWidth,height=source.naturalHeight;
    if(Math.max(width,height)<=2400)continue;
    const scale=1800/Math.max(width,height),canvas=document.createElement('canvas');
    canvas.width=Math.round(width*scale);canvas.height=Math.round(height*scale);
    try{
      const ctx=canvas.getContext('2d');
      if(!ctx)throw new Error('无法建立整图定位概览。');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(source,0,0,canvas.width,canvas.height);
      if(signal?.aborted)throw new DOMException('已取消','AbortError');
      records.push({index:images.length+overviewImages.length,sourceIndex:index,width:canvas.width,height:canvas.height,sourceWidth:width,sourceHeight:height});
      overviewImages.push(canvas.toDataURL('image/jpeg',.95));
    }finally{canvas.width=0;canvas.height=0;}
  }
  images.push(...overviewImages);
  return records;
}

    const call={wholeImage:true,nativeLayout:false,recognitionRecovery:true,inputWidth:W,inputHeight:H,pinnedModel,signal:controller.signal,maxAttempts:1,maxTotalMs:Infinity};audit.tiles.push(call);
    const recognitionStart=Date.now();

    try{scene=await requestEditableScene(src,W,H,call);}finally{audit.stages.recognitionMs=Date.now()-recognitionStart;delete call.signal;}
    if(controller.signal.aborted)throw new DOMException('Stopped','AbortError');

    const svg=sceneToSvgString(scene);

/* Only the wording is requested here; nothing is painted from these strings. */
async function requestRegionLabels(regions, canvas){
  const RR = roleRoute('recon');
  const cfgv = RR.cfg, relay = RR.relay, rBase = RR.base, rKey = RR.key, rProv = RR.provider;
  const paper = (($('#paper') && $('#paper').value) || '').slice(0, 2500);
  const list = regions.slice(0, 24).map(function(r, i){
    const place = (r.y < 160) ? 'top of the figure' : (r.w > 300 ? 'wide band, likely a panel title' : 'narrow strip, likely a box label');
    return (i+1) + '. ' + r.w + 'x' + r.h + ' px at (' + r.x + ',' + r.y + ') — ' + place;
  }).join('\n');
  const prompt = reconPrompt(regions.slice(0,24).length) + '\n\nDetected areas:\n' + list +
    '\n\nPaper content:\n' + paper;
  const model = editableReconstructionModel() || RR.model;
  if(!model) throw new Error(tt('analyze.needmodel'));

  let txt;
  if(cfgv.proto === 'anthropic' && !relay){
    const body = { model:model, max_tokens:1200, system:ANALYZE_SYS,
                   messages:[{ role:'user', content:[{ type:'text', text:prompt }] }] };
    const r = await fetch(rBase + '/v1/messages',
      { method:'POST', headers:anthropicHeaders(rKey), body:JSON.stringify(withReasoning(body,'recon')) });
    txt = await r.text();
    if(!r.ok) throw new Error(friendlyHttp(r.status, txt, rProv));
    const d = JSON.parse(txt);
    txt = (d.content||[]).filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('');
  }else{
    const body = { model:model, temperature:0.2,
                   messages:[{ role:'system', content:ANALYZE_SYS },
                             { role:'user', content:prompt }] };
    if(rProv === 'ark' && !relay) body.thinking = { type:'disabled' };
    const r = await postJSON(rBase, '/chat/completions', withReasoning(body,'recon'), rKey);
    txt = await r.text();
    if(!r.ok) throw new Error(friendlyHttp(r.status, txt, rProv));
    const d = JSON.parse(txt);
    txt = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '';
  }
  let j;
  try{ j = extractJSON(txt); }
  catch(err){ throw new Error(tt('recon.badjson')); }
  const raw = Array.isArray(j && j.labels) ? j.labels : [];
  // accept both the object form and a plain list of strings
  return raw.map(function(item){
    if(item && typeof item === 'object'){
      return { text:String(item.text || '').replace(/[\r\n]+/g,' ').slice(0, 48),
               x:Number(item.x) || 0, y:Number(item.y) || 0,
               w:Number(item.w) || 0, h:Number(item.h) || 0 };
    }
    return { text:String(item || '').replace(/[\r\n]+/g,' ').slice(0, 48), x:0, y:0, w:0, h:0 };
  });
}

/* Deterministic checks on the reconstructed scene, so a broken result is caught
   here rather than in Visio or PowerPoint. */
function auditReconScene(scene){
  const raw = scene.canvas || {};
  const c = { width:Number(raw.width || raw.w || EXPORT_CANVAS.w),
              height:Number(raw.height || raw.h || EXPORT_CANVAS.h) };
  const defects = [];
  const nodes = Array.isArray(scene.nodes) ? scene.nodes : [];
  const images = nodes.filter(function(n){ return n.type === 'image'; });
  const primitives = nodes.filter(function(n){ return n.type !== 'image'; });
  const canvasArea = Math.max(1, c.width * c.height);
  const dominantBitmap = images.some(function(n){ return Number(n.w||0) * Number(n.h||0) > canvasArea * 0.55; });
  if(dominantBitmap) defects.push({ kind:'dominant-bitmap' });
  if(primitives.length < 6) defects.push({ kind:'too-few-primitives' });
  const text = nodes.filter(function(n){ return n.type === 'text'; });
  text.forEach(function(n){
    if(n.x < 0 || n.y < 0 || n.x + n.w > c.width || n.y + n.h > c.height){
      defects.push({ id:n.id, kind:'out-of-canvas' });
    }
    if(!n.text || !n.text.trim()) defects.push({ id:n.id, kind:'empty-label' });
  });
  // overlapping label boxes are a layout bug worth reporting
  for(let i=0;i<text.length;i++){
    for(let j=i+1;j<text.length;j++){
      const a = text[i], b = text[j];
      const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
      const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
      if(ox > 2 && oy > 2) defects.push({ id:a.id + '+' + b.id, kind:'overlap' });
    }
  }
  return { ok: defects.length === 0, defects: defects, primitiveCount:primitives.length, imageCount:images.length, dominantBitmap:dominantBitmap };
}

/* A finished file is offered as a link as well as auto-downloaded: the browser can drop
   an automatic download without telling anyone, and then a successful export looks like
   nothing happened. */
function offerDownload(container, filename, blobOrText, mime){
  if(!container) return;
  const blob = (blobOrText instanceof Blob) ? blobOrText : new Blob([blobOrText], {type:mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const size = blob.size < 1024 ? (blob.size + ' B') : (Math.round(blob.size/1024) + ' KB');
  const row = document.createElement('div');
  row.className = 'export-dl';
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.textContent = tt('export.getFile', { format: filename });
  // Keep a single object URL alive for the visible fallback link. Encoding the
  // entire OOXML file again as a data URL doubled peak memory for large figures.
  const s = document.createElement('span');
  s.textContent = tt('export.fileReady', { size: size });
  row.appendChild(a); row.appendChild(s);
  const old = container.querySelector('.export-dl');
  if(old){
    // Release the previous export's object URL only now, when it is being replaced.
    // The automatic download frees its own URL after a few seconds, but this link has to
    // stay usable for as long as it is on screen: revoking it on a timer is what made a
    // later click do nothing.
    if(old.dataset.objectUrl) { try{ URL.revokeObjectURL(old.dataset.objectUrl); }catch(e){} }
    old.remove();
  }
  row.dataset.objectUrl = url;
  container.appendChild(row);
}

/* Some strings must never degrade into a raw key. If the dictionary is a cached older
   copy it can be missing a key entirely, and tt() then returns the key itself, so the
   user reads "export.getFile". These fallbacks keep the export usable in that case. */
const EXPORT_TEXT = {
  en: { 'export.getFile':'Download {format}', 'export.fileReady':'{size} ready - click if it did not start',
        'export.building':'Building {format}...', 'export.ready':'Choose a format, then click "Confirm and export".',
        'export.needRecon':'Exported as a picture for now. Use the rebuild button above to turn it into editable text.' },
  zh: { 'export.getFile':'下载 {format}', 'export.fileReady':'{size} 已生成——若未自动下载请点这里',
        'export.building':'正在生成 {format}…', 'export.ready':'请选择格式，然后点击“确认设置并导出”。',
        'export.needRecon':'当前导出为图片。点上方按钮可转为可编辑文字。' }
};
function exportText(key, vars){
  let s = tt(key, vars);
  // tt() returns the key itself when the dictionary has no entry for it
  if(s === key){
    const lang = (window.GAL_I18N && window.GAL_I18N.lang) || 'en';
    const table = EXPORT_TEXT[lang] || EXPORT_TEXT.en;
    s = table[key] || EXPORT_TEXT.en[key] || key;
  }
  if(vars) s = String(s).replace(/\{(\w+)\}/g, function(m, k){ return vars[k] != null ? vars[k] : m; });
  return s;
}

/* Write the message into a child element rather than into the container's textContent:
   assigning textContent clears every child, which would wipe the download link that the
   export puts in the same box. The container's original static text is cleared once, so
   the seed message from the markup cannot linger beside the live one. */
function setExportStatus(container, text){
  if(!container) return;
  let msg = container.querySelector('.export-msg');
  if(!msg){
    msg = document.createElement('div');
    msg.className = 'export-msg';
    container.insertBefore(msg, container.firstChild);
    Array.prototype.slice.call(container.childNodes).forEach(function(node){
      if(node !== msg && node.nodeType === 3) container.removeChild(node);
    });
  }
  msg.textContent = text;
}

/* A determinate bar for the export. The work runs in stages whose counts are known, so
   the bar reports real progress instead of an indefinite spinner. */
function showExportProgress(container, label){
  if(!container) return null;
  let box = container.querySelector('.export-progress');
  if(!box){
    box = document.createElement('div');
    box.className = 'export-progress';
    box.innerHTML = '<div class="export-progress-label"></div>' +
                    '<div class="export-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">' +
                    '<div class="export-progress-fill"></div></div>';
    const msg = container.querySelector('.export-msg');
    if(msg && msg.nextSibling) container.insertBefore(box, msg.nextSibling);
    else container.appendChild(box);
  }
  const lab = box.querySelector('.export-progress-label');
  if(lab) lab.textContent = label || '';
  // Reset to empty here, not only when the element is created: a second export reuses the
  // same bar, and a bar left showing the previous run reads as "no progress at all".
  const fill = box.querySelector('.export-progress-fill');
  if(fill) fill.style.width = '0%';
  const track = box.querySelector('.export-progress-track');
  if(track) track.setAttribute('aria-valuenow', '0');
  return box;
}
function setExportProgress(container, percent){
  const box = container && container.querySelector('.export-progress');
  if(!box) return;
  const clamped = Math.max(0, Math.min(100, Math.round(percent)));
  const fill = box.querySelector('.export-progress-fill');
  const track = box.querySelector('.export-progress-track');
  if(fill) fill.style.width = clamped + '%';
  if(track) track.setAttribute('aria-valuenow', String(clamped));
}
function clearExportProgress(container){
  const box = container && container.querySelector('.export-progress');
  if(box) box.remove();
}

/* Advance the bar across the stages the export actually performs. The label carries the
   stage name only; the status message above it already says what is being built, so
   repeating it here would read as duplicated text. */
function runStagedProgress(container, label, steps, task){
  const box = showExportProgress(container, steps[0].label || '');
  setExportProgress(container, steps[0].at * 100);
  let i = 1;
  const timer = setInterval(function(){
    if(i >= steps.length){ clearInterval(timer); return; }
    setExportProgress(container, steps[i].at * 100);
    const lab = box && box.querySelector('.export-progress-label');
    if(lab) lab.textContent = steps[i].label || '';
    i++;
  }, 140);
  const done = function(){ clearInterval(timer); };
  return Promise.resolve()
    .then(task)
    .then(function(v){ done(); setExportProgress(container, 97); return v; },
          function(e){ done(); setExportProgress(container, 1); throw e; });
}

/* Keep the label visible while work runs, so a slow build never looks like a no-op. */
function setBusy(btn, busy, label){
  if(!btn) return;
  btn.disabled = !!busy;
  btn.setAttribute('aria-busy', busy ? 'true' : 'false');
  btn.classList.toggle('is-busy', !!busy);
  if(busy){
    if(btn.dataset.idle === undefined) btn.dataset.idle = btn.textContent;
    btn.textContent = '';
    const sp = document.createElement('span');
    sp.className = 'btn-spin';
    sp.setAttribute('aria-hidden', 'true');
    btn.appendChild(sp);
    const tx = document.createElement('span');
    tx.textContent = label || tt('export.working');
    btn.appendChild(tx);
  }else{
    btn.classList.remove('is-busy');
    if(btn.dataset.idle !== undefined){ btn.textContent = btn.dataset.idle; delete btn.dataset.idle; }
  }
}

function svgPreviewDocument(svg){
  // Resize a preview copy only; downloads and editable exports keep the source.
  const doc=new DOMParser().parseFromString(svg,'image/svg+xml');
  const root=doc.documentElement;
  if(root.localName!=='svg' || doc.querySelector('parsererror')) return svg;
  const box=readViewBox(root);
  if(box){
    // Add breathing room to the preview copy so the full figure fits inside the shared iframe.
    const padX=box.w*.12,padY=box.h*.12;
    root.setAttribute('viewBox',`${box.x-padX} ${box.y-padY} ${box.w+padX*2} ${box.h+padY*2}`);
  }
  root.setAttribute('preserveAspectRatio','xMidYMid meet');
  for(const [name,value] of Object.entries({width:'100%',height:'100%','min-width':'0','min-height':'0','max-width':'100%','max-height':'100%',margin:'0',display:'block'})){
    root.style.setProperty(name,value,'important');
  }
  return `<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}</style></head><body>${new XMLSerializer().serializeToString(root)}</body></html>`;
}

function imagePromptBudget(model){
  // Qwen's documented prompt limits are in tokens; leave room for tokenizer variance.
  if(/qwen-image-2\.0/i.test(model)) return {unit:'tokens',limit:1050};
  if(/qwen-image/i.test(model)) return {unit:'tokens',limit:650};
  // Other gateways do not expose a uniform prompt limit. Use a practical ceiling
  // rather than pretending their image models all share the same token window.
  return {unit:'chars',limit:6000};
}
function imagePromptSize(text,budget){
  if(budget.unit==='chars') return text.length;
  const nonAscii=(text.match(/[^\x00-\x7f]/g)||[]).length;
  return Math.ceil(nonAscii*1.5+(text.length-nonAscii)/3);
}
function fitImagePrompt(text,budget,available){
  if(available<=0) return '';
  if(imagePromptSize(text,budget)<=available) return text;
  let low=0,high=text.length;
  while(low<high){
    const mid=Math.ceil((low+high)/2);
    if(imagePromptSize(text.slice(0,mid),budget)<=available) low=mid;
    else high=mid-1;
  }
  return text.slice(0,low).trimEnd();
}
function prioritizedImagePaper(content,budget,available){
  const paragraphs=String(content||'').split(/\n\s*\n/).map((text,index)=>({text:text.trim(),index})).filter(x=>x.text);
  const score=text=>{
    const head=text.slice(0,120).toLowerCase();
    return (/绘图提示|figure prompt|绘图要求|drawing requirement/.test(head)?100:0)
      +(/方法|流程|pipeline|method|framework|architecture|模块|module|input|output|输入|输出/.test(head)?20:0)
      +(/结果|实验|result|benchmark|metric|性能/.test(head)?10:0)
      -(/^(标题|title|摘要|abstract)[:：]/.test(head)?10:0);
  };
  paragraphs.sort((a,b)=>score(b.text)-score(a.text)||a.index-b.index);
  const selected=[];
  for(const paragraph of paragraphs){
    const remaining=available-imagePromptSize(selected.join('\n\n'),budget);
    const fitted=fitImagePrompt(paragraph.text,budget,remaining-(selected.length?2:0));
    if(fitted) selected.push(fitted);
    if(fitted.length<paragraph.text.length) break;
  }
  return selected.join('\n\n');
}
function compactImageGuide(j){
  if(!j || !Array.isArray(j.layoutBlueprint)) return '';
  const zones=j.layoutBlueprint.slice(0,16).map((z,i)=>{
    if(!z || typeof z!=='object') return '';
    const name=String(z.role||z.id||z.name||'module').slice(0,10);
    const nums=[z.x,z.y,z.w,z.h].map(Number);
    const box=nums.every(Number.isFinite)?` @${nums.map((n,k)=>Math.round(n/(k%2?900:1600)*100)).join(',')}%`:'';
    return `${i+1}:${name}${box}`;
  }).filter(Boolean);
  const palette=Array.isArray(j.palette)?j.palette.slice(0,5).join(',')
    : j.palette && typeof j.palette==='object'
      ? ['background','primary','accent','neutral'].map(k=>j.palette[k]).filter(Boolean).slice(0,5).join(',')
      : '';
  return zones.length ? `Layout zones (${zones.length}; preserve every zone): ${zones.join(' | ')}.\n${palette?`Palette: ${palette}.\n`:''}` : '';
}
function selectImageRoute(route){
  const status=imageRoutes.status(route);

}

  inspAttachImage(inspRec, exportImgSrc, {name:'figure-forge-'+inspRec.id, width:actualWidth, height:actualHeight});
  if(!verifyImageRatio(actualWidth,actualHeight,ratio)){
    recordImageRoute({...route,references:usedRefs},'blocked');
    throw new Error(tt('img.ratioMismatch',{ratio,width:actualWidth,height:actualHeight}));
  }
  if(!verifyImageResolution(actualWidth,actualHeight,resolution,dimensions.field==='size'?dimensions.value:null)){
    recordImageRoute({...route,references:usedRefs},'blocked');
    throw new Error(tt('img.resolutionMismatch',{resolution,width:actualWidth,height:actualHeight}));
  }
  recordImageRoute({...route,references:usedRefs},'verified');
  $('#out').style.display='block';
  $('#out').innerHTML = `<img data-step3-output="true" src="${esc(imgSrc)}" alt="draft">
    <div class="dl"><button type="button" class="btn-primary" id="dlImg">${tt('img.download')}</button>
    <span class="hint">${r.referenceFallback?tt('img.referenceFallback'):usedRefs?tt('img.hintRef',{n:useIds.length}):tt('img.hint')} · ${ratio} · ${actualWidth}×${actualHeight}px · ${esc(model)}${attempted.length>1?' · 已切换已验证备用线路':''}</span></div>`;
  // Bind the bitmap download as soon as Step 3 has its verified image. Step 4
  // can take minutes and must never gate or replace this button.
  $('#dlImg').onclick = async ()=>{
    try{
      const response=await fetch(exportImgSrc);
      if(!response.ok) throw new Error('Image download failed');
      const blob=await response.blob();
      const ext=blob.type.includes('webp')?'webp':/jpe?g/.test(blob.type)?'jpg':'png';
      downloadBlob('figure-forge-draft.'+ext,blob);
    }catch(e){ window.open(exportImgSrc,'_blank'); }
  };
  markStep3Output(exportImgSrc); st.recon = null; st.reconPending = true;
  /* Keep Step 4 visibly pending while the vision API reconstructs the scene.
     Do not expose a raster-wrapped SVG as if it were editable. */
  showEditableExportStep({ svg:'', source:'bitmap', bitmap:exportImgSrc, reconPending:true });
  /* The Step 3 image is ready immediately; the real vision rebuild continues
     in Step 4 without making the user wait to inspect or download that image. */
  void (async()=>{
  let reconOk = false;
  try{ reconOk = await runReconstruction(); }
  catch(e){ st.reconError=safeExportError(e); console.warn('automatic editable reconstruction failed', e); }
  if(reconOk===null)return;
  st.reconPending = false;
  if(!reconOk){
    const reconStatus=$('#reconStatus');
    const reconError=String(st.reconError||'Editable reconstruction failed');
    const reconMessage=tt('recon.failedDetail',{msg:reconError});
    if(reconStatus) reconStatus.textContent=reconMessage;
    /* Do not leave a raster-wrapped SVG selectable as if it were editable. */
    st.svg=''; st.baseSvg=''; st.scene=null; st.recon=null;
    st.reconFailed = true;
    st.reconError = reconError;
    renderEditableExportCard();
  } else {
    renderEditableExportCard();
  }
  })();
}

/* ---------- boot ---------- */
document.title = '超级AI绘图 · 上传参考图画自己的主图';
GAL_I18N.apply();
renderRefsStrip();
renderCfgFacts();
refreshStepOneText();
inspRender();
syncContentMode();
// Run once at startup, at top level: without a draft this puts step 4 into its locked
// state, so the card is visible and explains what it is waiting for.
renderEditableExportCard();

  mode='image';
  document.querySelectorAll('#modeTabs button').forEach(x=>x.classList.toggle('on', x.dataset.mode==='image'));

}

const startupModels=Promise.all([populateModels()]);
await startupModels;
renderCfgFacts();
</script>
