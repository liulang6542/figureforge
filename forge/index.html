<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="./nonelinear-config.js"></script>
<title>超级AI绘图 · 上传参考图画自己的主图</title>
<style>
  /* ============================================================
     FigureForge — design tokens
     单一强调色 + 中性灰阶；颜色只承担语义（成功/警告/错误）
     ============================================================ */
  :root{
    --bg:#f5f5f6; --surface:#fff; --surface-2:#fafafb; --surface-3:#f2f2f4;
    --line:#e9e9ec; --line-2:#dcdce0;
    --ink:#18181b; --ink-2:#3f3f46; --muted:#71717a; --faint:#a1a1aa;
    --accent:#4f46e5; --accent-2:#4338ca; --accent-soft:#eef2ff; --accent-line:#c7d2fe;
    --ok:#15803d; --ok-soft:#f0fdf4; --ok-line:#bbf7d0;
    --warn:#b45309; --warn-soft:#fffbeb; --warn-line:#fde68a;
    --err:#b91c1c; --err-soft:#fef2f2; --err-line:#fecaca;
    --r-sm:8px; --r:10px; --r-md:12px; --r-lg:14px;
    --sh-1:0 1px 2px rgba(24,24,27,.045);
    --sh-2:0 10px 28px -16px rgba(24,24,27,.22);
    --ease:cubic-bezier(.16,1,.3,1);
    --topbar-h:84px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  #card1,#card3,#card4{scroll-margin-top:calc(var(--topbar-h) + 16px)}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.6;
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  ::selection{background:#ddd6fe;color:#312e81}
  .sprite{position:absolute;width:0;height:0;overflow:hidden}
  .i{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;
     stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ================= topbar ================= */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(245,245,246,.88);
          -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
          border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:11px 26px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1 1 auto}
  .mark{width:34px;height:34px;flex:0 0 auto;border-radius:9px;background:var(--ink);color:#fff;
        display:grid;place-items:center;box-shadow:var(--sh-1)}
  .mark svg{width:19px;height:19px;stroke-width:1.9}
  .brand-text{display:grid;gap:1px;min-width:0}
  .brand-title{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;
               letter-spacing:-.012em;line-height:1.25;white-space:nowrap}
  .brand-title em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
                  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);
                  padding:0 5px;border-radius:4px;line-height:16px}
  .brand-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flow-nav{display:flex;align-items:center;gap:2px;margin-left:auto;background:var(--surface);
            border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:var(--sh-1)}
  .fn{display:flex;align-items:center;gap:8px;padding:6px 13px;border-radius:8px;font-size:12.5px;
      font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap;
      transition:background .18s var(--ease),color .18s var(--ease)}
  .fn b{width:17px;height:17px;border-radius:5px;background:var(--surface-3);color:var(--faint);
        font-size:10.5px;font-weight:800;display:grid;place-items:center;transition:inherit}
  .fn:hover{color:var(--ink);background:var(--surface-2)}
  .fn.on{background:var(--ink);color:#fff}
  .fn.on b{background:rgba(255,255,255,.2);color:#fff}
  .pill{max-width:1500px;margin:0 auto;padding:0 26px 8px;display:flex;align-items:center;gap:6px;
        font-size:11px;color:var(--faint);line-height:1.5}
  .pill .i{width:12px;height:12px;stroke-width:1.9}

  /* ================= workbench shell ================= */
  .workbench{max-width:1500px;margin:0 auto;padding:20px 26px 72px;
             display:grid;grid-template-columns:minmax(400px,452px) minmax(0,1fr);gap:18px;align-items:start}
  .col{display:grid;gap:14px;min-width:0;align-content:start}
  .col-left{min-width:0}

  /* ================= card ================= */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
        box-shadow:var(--sh-1);overflow:hidden}
  .card-hd{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .hd-t{min-width:0;flex:1 1 auto}
  .card-hd h2{font-size:14px;font-weight:700;letter-spacing:-.012em;line-height:1.45}
  .step-note{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.5}
  .num{width:22px;height:22px;flex:0 0 auto;border-radius:50%;background:var(--ink);color:#fff;
       display:grid;place-items:center;font-size:11.5px;font-weight:800;margin-top:1px}
  .num-muted{background:var(--surface-3);color:var(--muted)}
  .card-bd{padding:14px 16px 16px;display:grid;gap:12px}

  /* ================= box (section inside card) ================= */
  .box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
       padding:13px 14px;min-width:0}
  .b-indigo,.b-green,.b-purple,.b-amber,.b-slate{background:var(--surface-2);border-color:var(--line)}
  .box h4{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
          color:var(--ink-2);margin-bottom:11px;letter-spacing:.004em}
  .box h4 .i{width:14px;height:14px;color:var(--faint)}
  .box h4 small{margin-left:auto;font-weight:600;font-size:10.5px;color:var(--faint);
                background:var(--surface-3);border-radius:5px;padding:1px 6px;white-space:nowrap;
                letter-spacing:.01em}
  .box h4 small:not(:first-child){margin-left:auto}
  .box .chkline{margin-top:9px}
  .box .corsnote{margin-top:9px}
  .box .refs-strip{margin-bottom:0}
  .box .tabs,.box .pass-tabs{background:var(--surface-3);border:0}

  /* ================= field rows ================= */
  .bfield{display:flex;align-items:center;gap:10px;margin-bottom:9px;min-width:0}
  .bfield:last-child{margin-bottom:0}
  .blab{font-size:11.5px;font-weight:650;color:var(--muted);white-space:nowrap;min-width:76px;letter-spacing:.005em}
  .bfield > select,.bfield > input[type=text],.bfield > input[type=password]{flex:1 1 auto;min-width:0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .ex-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
  .ex-row > span:first-child{font-size:11.5px;color:var(--muted)}

  /* ================= controls ================= */
  input[type=text],input[type=password],select,textarea{
    font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;outline:none;
    transition:border-color .16s,box-shadow .16s;min-width:0;max-width:100%}
  input[type=text]:focus,input[type=password]:focus,select:focus,textarea:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  select{cursor:pointer;color:var(--ink)}
  textarea{width:100%;min-height:168px;resize:vertical;line-height:1.65;background:var(--surface)}

  button{font:inherit;cursor:pointer;border:0;background:none;border-radius:var(--r-sm);
         transition:background .16s,border-color .16s,color .16s,box-shadow .16s,transform .1s}
  button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-primary{background:var(--accent);color:#fff;font-weight:650;font-size:13px;padding:9px 18px;
               box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 1px 2px rgba(24,24,27,.1)}
  .btn-primary:hover:not(:disabled){background:var(--accent-2)}
  .btn-primary:active:not(:disabled){transform:translateY(1px)}
  .btn-primary:disabled{background:var(--surface-3);color:var(--faint);box-shadow:none;cursor:not-allowed}
  .btn-ghost{background:var(--surface);color:var(--ink-2);font-weight:600;font-size:12.5px;
             padding:8px 13px;border:1px solid var(--line-2)}
  .btn-ghost:hover{border-color:var(--ink-2);color:var(--ink)}
  .btn-mini{background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:600;
            padding:4px 11px;border:1px solid var(--line-2);border-radius:999px}
  .btn-mini:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
  .btn-tiny{background:none;color:var(--muted);font-size:11.5px;text-decoration:underline;
            text-underline-offset:2px;padding:3px 5px}
  .btn-sm{padding:7px 12px;font-size:12px;white-space:nowrap}

  /* ================= hints & status ================= */
  .hint{color:var(--muted);font-size:11.5px;margin-top:8px;line-height:1.55}
  .bnote{font-size:11.5px;line-height:1.55;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
  .bnote.tiny{font-size:11px;color:var(--faint);margin-top:7px}
  .bnote .warn-txt{color:var(--err);font-weight:700}
  .bnote.err{color:var(--err);background:var(--err-soft);border:1px solid var(--err-line);
             border-radius:var(--r-sm);padding:7px 10px;margin-top:8px;font-weight:600}
  .bnote.warn-inline{color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);
                     border-radius:var(--r-sm);padding:7px 10px;margin-top:8px}
  .bnote.audit-ok{color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-line);
                  border-radius:var(--r-sm);padding:7px 10px;margin-top:8px}
  .status-line{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;line-height:1.5;
    color:var(--muted);background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:7px 10px;overflow-wrap:anywhere;margin-top:9px}
  .status-line::before{content:"";flex:0 0 6px;width:6px;height:6px;border-radius:50%;
    background:var(--faint);margin-top:6px}
  .status-line[data-state="loading"]{color:var(--accent-2);background:var(--accent-soft);border-color:var(--accent-line)}
  .status-line[data-state="loading"]::before{background:var(--accent);animation:parsePulse 1.4s ease-in-out infinite}
  .status-line[data-state="success"]{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
  .status-line[data-state="success"]::before{background:var(--ok)}
  .status-line[data-state="error"]{color:var(--err);background:var(--err-soft);border-color:var(--err-line)}
  .status-line[data-state="error"]::before{background:var(--err)}
  @keyframes parsePulse{50%{opacity:.45}}
  .meta-line{margin:7px 1px 0;font-size:11px;color:var(--faint);overflow-wrap:anywhere}
  .meta-line.warn{color:var(--err);font-weight:700}
  .corsnote{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);
            border-radius:var(--r-sm);padding:8px 11px;margin-top:10px;font-size:11.5px}
  .errlist{background:var(--err-soft);border:1px solid var(--err-line);color:var(--err);
           border-radius:var(--r);padding:9px 12px;font-size:12.5px}
  .errlist div{margin:2px 0 2px 16px}
  .chkline{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:10px}
  .infistar-signup{margin:0 0 10px !important;padding-left:86px;font-size:11.5px}
  .infistar-signup a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}

  /* ================= pdf upload ================= */
  .pdf-upload-btn{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;
    border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink);
    transition:border-color .18s var(--ease),background .18s,box-shadow .18s,transform .1s}
  .pdf-upload-btn:hover:not(:disabled){border-color:var(--accent-line);background:var(--accent-soft);
    box-shadow:0 0 0 3px rgba(79,70,229,.09)}
  .pdf-upload-btn:active:not(:disabled){transform:translateY(1px)}
  .pdf-upload-btn:disabled{cursor:progress;opacity:.62}
  .pdf-upload-btn.is-locked{cursor:not-allowed;opacity:.5;filter:grayscale(.55)}
  .pdf-upload-icon{display:grid;place-items:center;width:30px;height:30px;flex:0 0 auto;
    border-radius:7px;background:var(--surface-3);color:var(--ink-2);
    font-size:9.5px;font-weight:800;letter-spacing:.03em;transition:inherit}
  .pdf-upload-btn:hover:not(:disabled) .pdf-upload-icon{background:var(--accent);color:#fff}
  .pdf-upload-copy{text-align:left;display:grid;gap:0;line-height:1.3}
  .pdf-upload-copy strong{font-size:12.5px;font-weight:700}
  .pdf-upload-copy small{font-size:10.5px;color:var(--muted);font-weight:400}
  .pdf-upload-arrow{display:none}

  /* ================= refs ================= */
  .refs-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;
                flex-wrap:wrap;margin-bottom:12px}
  .refs-heading h4{margin:0}
  .refs-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #refsSummary{color:var(--ink-2);font-size:11.5px;font-weight:650;background:var(--surface-3);
               border-radius:5px;padding:1px 7px;white-space:nowrap}
  #refsUploadStatus{color:var(--err)}
  .refs-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .refmini{display:flex;gap:8px;align-items:center;background:var(--surface);
           border:1px solid var(--line);border-radius:var(--r);padding:5px 8px 5px 5px;
           font-size:11.5px;max-width:340px;min-width:0;animation:fadeIn .25s ease;cursor:zoom-in;
           transition:border-color .16s,box-shadow .16s}
  .refmini:hover{border-color:var(--line-2);box-shadow:var(--sh-1)}
  .refmini>div{min-width:0}
  .refmini img{width:46px;height:35px;object-fit:cover;border-radius:6px;flex:0 0 auto;
               cursor:zoom-in;transition:filter .16s}
  .refmini img:hover{filter:brightness(.9)}
  .refmini img:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .refmini b{font-weight:650;display:block;white-space:nowrap;overflow:hidden;
             text-overflow:ellipsis;max-width:210px}
  .refmini span{color:var(--faint);font-size:10.5px}
  .refmini .x{margin-left:4px;color:var(--faint);cursor:pointer;font-weight:700;font-size:13px;
              border:0;background:none;line-height:1}
  .refmini .x:hover{color:var(--err)}

  /* ================= segmented tabs ================= */
  .tabs,.pass-tabs{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px}
  .tabs button,.pass-tabs button{padding:6px 14px;font-size:12.5px;font-weight:600;
    color:var(--muted);background:transparent;border-radius:7px;transition:.18s var(--ease)}
  .tabs button .subtag,.pass-tabs button .subtag{display:block;font-size:10px;font-weight:500;
    color:var(--faint);margin-top:1px;line-height:1.3}
  .tabs button:hover,.pass-tabs button:hover{color:var(--ink-2)}
  .tabs button.on,.pass-tabs button.on{background:var(--surface);color:var(--ink);
    box-shadow:0 1px 2px rgba(24,24,27,.12)}
  .tabs button.on .subtag,.pass-tabs button.on .subtag{color:var(--muted)}
  .srow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ================= stepper ================= */
  .stepper{display:flex;align-items:flex-start;margin:14px 0 4px}
  .stp{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:2}
  .stp .ball{width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--faint);
    display:grid;place-items:center;font-weight:800;font-size:12px;
    transition:background .3s,color .3s}
  .stp .lbl{font-size:11px;font-weight:650;color:var(--faint);white-space:nowrap;transition:color .3s}
  .stp.active .ball{background:var(--accent);color:#fff;animation:pulseRing 1.6s ease-out infinite}
  .stp.active .lbl{color:var(--accent)}
  .stp.done .ball{background:var(--ok);color:#fff;animation:none}
  .stp.done .lbl{color:var(--ok)}
  .stline{flex:1;height:2px;background:var(--line);margin:12px 6px 0;border-radius:2px;
          position:relative;overflow:hidden;min-width:46px}
  .stline .fill{position:absolute;inset:0;width:0;background:var(--ok);
                transition:width .55s var(--ease);border-radius:2px}
  .stline.active .fill{width:100%}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(79,70,229,.34)}
    70%{box-shadow:0 0 0 8px rgba(79,70,229,0)}100%{box-shadow:0 0 0 0 rgba(79,70,229,0)}}

  /* ================= analyze result ================= */
  .analyze-box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
    padding:12px 14px;animation:fadeUp .35s ease}
  .analyze-box h4{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:10px;
    display:flex;align-items:center;gap:7px}
  .analyze-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
  .az{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px}
  .az b{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
        color:var(--faint);font-weight:700;margin-bottom:2px}
  .az span{font-size:12px;color:var(--ink-2)}
  .palette-list{display:flex;flex-wrap:wrap;gap:6px 10px;line-height:1.55}
  .palette-chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .palette-swatch{display:inline-block;width:13px;height:13px;border:1px solid rgba(24,24,27,.16);
    border-radius:4px;flex:0 0 auto}
  .palette-chip code{font:inherit;color:var(--muted);font-size:11px}
  .rep-strip{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;align-items:center}
  .rep-strip b{font-size:11px;color:var(--faint);font-weight:650}
  .rep-chip{display:flex;align-items:center;gap:6px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 8px 2px 2px;
    font-size:11px;font-weight:650;color:var(--ink-2)}
  .rep-chip img{width:32px;height:24px;object-fit:cover;border-radius:5px}

  /* ================= flow note (upload dropzone) ================= */
  .flow-note{border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface-2);
    padding:12px 14px;font-size:12px;line-height:1.6;color:var(--ink-2)}
  .flow-note > label{display:block;font-weight:650;font-size:12px;margin-bottom:6px;color:var(--ink-2)}
  #exportBitmapUpload{max-width:100%;font-size:11.5px;color:var(--muted)}
  #exportBitmapUpload::file-selector-button{margin-right:10px;padding:7px 15px;border:1px solid var(--line-2);
    border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;
    font-weight:650;cursor:pointer;transition:.16s}
  #exportBitmapUpload::file-selector-button:hover{border-color:var(--accent);color:var(--accent);
    background:var(--accent-soft)}
  #exportBitmapUpload:disabled::file-selector-button{opacity:.5;cursor:not-allowed}
  #exportUseGenerated{margin-top:8px;font-size:12px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border:1px solid var(--accent-line);padding:6px 12px;
    border-radius:var(--r-sm)}
  #exportInputStatus{font-size:11.5px;color:var(--muted);margin-top:6px}
  #exportInputPreview{margin-top:9px;border:1px solid var(--line);border-radius:var(--r-sm)}
  .step4-replica-hint{margin-left:auto;align-self:center;max-width:100%;padding:4px 10px;
    border:1px solid var(--accent-line);border-radius:999px;background:var(--accent-soft);
    color:var(--accent-2);font-size:11px;font-weight:650;line-height:1.5;white-space:nowrap}
  @media(max-width:900px){.step4-replica-hint{display:none}}

  /* ================= generate row / output ================= */
  .gen-row{display:flex;justify-content:stretch;margin-top:2px}
  .gen-row .btn-primary{width:100%;padding:11px 22px;font-size:13.5px;border-radius:var(--r)}
  #out{border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:70px;
       background:var(--surface-2);display:none;animation:fadeUp .35s ease}
  #out iframe{display:block;width:100%;height:min(72dvh,760px);border:0;border-radius:var(--r-sm);
              background:#fff}
  #out img{max-width:100%;border-radius:var(--r-sm);display:block;margin:0 auto}
  .dl{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .empty-note{color:var(--faint);text-align:center;padding:30px 0;font-size:12.5px}
  .spin{color:var(--muted);padding:18px 0;text-align:center;font-size:12.5px}
  .spin.big::before{content:"";display:inline-block;width:14px;height:14px;border:2px solid var(--accent-line);
    border-top-color:var(--accent);border-radius:50%;margin-right:9px;vertical-align:-2px;
    animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .err{color:var(--err);font-weight:600}

  /* ================= export card ================= */
  .export-recon{margin-top:0;border:1px dashed var(--accent-line);border-radius:var(--r);
    padding:11px 12px;background:var(--accent-soft)}
  .recon-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
  .recon-row button{font-size:12px;font-weight:600;padding:7px 12px;background:var(--surface);
    border:1px solid var(--line-2);border-radius:var(--r-sm);color:var(--ink-2)}
  .recon-row button:hover{border-color:var(--accent);color:var(--accent)}
  .recon-status{flex-basis:100%;max-width:100%;padding:9px 13px;border:1px solid var(--accent-line);
    border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent-2);
    font-size:13px;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
  .recon-status:empty{display:none}
  .export-font-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .export-font-row label{font-size:11.5px;color:var(--muted);font-weight:650;white-space:nowrap}
  .export-font-row select{flex:1 1 auto;min-width:0}
  .export-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
  .export-actions button{min-height:56px;padding:10px 12px;border:1px solid var(--line-2);
    border-radius:var(--r);background:var(--surface);color:var(--ink);text-align:left;
    transition:border-color .16s,background .16s,box-shadow .16s}
  .export-actions button:hover:not(:disabled){border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(79,70,229,.1);background:var(--surface)}
  .export-actions button.selected{border-color:var(--accent);background:var(--accent-soft);
    box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .export-actions button:disabled{cursor:not-allowed;opacity:.5}
  .export-actions button strong{display:block;font-size:13px;font-weight:700;letter-spacing:-.01em}
  .export-actions button small{display:block;margin-top:2px;color:var(--muted);
    font-size:10.5px;font-weight:500;line-height:1.45}
  .export-confirm-row{display:flex;justify-content:flex-end;margin-top:2px}
  .export-confirm{min-width:160px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .export-confirm:disabled{cursor:progress}
  .btn-spin{width:13px;height:13px;flex:0 0 auto;border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
  .export-busy{background:var(--accent-soft);color:var(--accent-2)}
  .export-status{margin-top:2px;border-radius:var(--r-sm);padding:9px 11px;background:var(--surface-2);
    color:var(--muted);font-size:11.5px;line-height:1.55;border:1px solid var(--line)}
  .export-dl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--accent-line);
    background:var(--accent-soft);border-radius:var(--r-sm);padding:9px 11px}
  .export-dl a{font-weight:650;color:var(--accent-2);text-decoration:underline;font-size:12.5px}
  .export-dl span{color:var(--accent-2);font-size:11.5px}
  .export-msg{line-height:1.55}
  #card4.export-locked .box{opacity:.68}
  #card4.export-locked .export-actions button{cursor:not-allowed}
  .export-progress{margin-top:2px}
  .export-progress-label{font-size:11.5px;color:var(--accent-2);margin-bottom:5px}
  .export-progress-track{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
  .export-progress-fill{height:100%;width:0;border-radius:999px;background:var(--accent);
    transition:width .16s ease}
  @media(max-width:760px){.export-actions{grid-template-columns:repeat(2,minmax(0,1fr))}}

  /* ================= guide ================= */
  .card-guide summary{list-style:none;cursor:pointer;align-items:center}
  .card-guide summary::-webkit-details-marker{display:none}
  .card-guide summary .chev{width:15px;height:15px;color:var(--faint);align-self:center;
    transition:transform .22s var(--ease)}
  .card-guide details[open] summary .chev{transform:rotate(180deg)}
  .card-guide details[open] summary{border-bottom:1px solid var(--line)}
  .guide{font-size:12.5px;color:var(--ink-2);padding:2px 0;line-height:1.65}
  .guide li{margin:6px 0 6px 17px}
  .guide li::marker{color:var(--faint)}
  .guide b{color:var(--ink);font-weight:650}

  /* ================= motion ================= */
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;scroll-behavior:auto !important}
  }

  /* ================= responsive ================= */
  @media(max-width:1180px){
    .workbench{grid-template-columns:1fr}
  }
  @media(max-width:900px){
    .brand-sub{display:none}
    .flow-nav .fn span{display:none}
    .flow-nav .fn{padding:6px 9px}
  }
  @media(max-width:640px){
    .topbar-inner{padding:10px 14px;gap:10px}
    .pill{padding:0 14px 8px}
    .workbench{padding:14px 14px 56px;gap:12px}
    .card-bd{padding:12px 13px 14px}
    .bfield{flex-wrap:wrap}
    .blab{min-width:0}
    .bfield > select,.bfield > input[type=text],.bfield > input[type=password]{flex:1 1 100%}
    .tabs,.pass-tabs{display:flex;flex-wrap:wrap;width:100%}
    .tabs button,.pass-tabs button{flex:1 1 46%;min-width:0}
    .infistar-signup{padding-left:0 !important}
    .ex-row{margin-left:0;width:100%}
    textarea{min-height:140px}
  }
  /* ---- settings status strip (replaces the inline provider form) ---- */
  .tb-link{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;
           color:var(--ink-2);text-decoration:none;background:var(--surface);border:1px solid var(--line-2);
           border-radius:var(--r-sm);padding:6px 10px;cursor:pointer;
           transition:border-color .18s,color .18s,background .18s}
  .tb-link:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
  .tb-link .i{width:13px;height:13px}
  .hd-link{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
           color:var(--accent);text-decoration:none;background:var(--accent-soft);border-radius:5px;
           padding:2px 7px;white-space:nowrap;transition:background .18s,color .18s}
  .hd-link:hover{background:var(--accent);color:#fff}
  .hd-link .i{width:10px;height:10px}
  .cfg-facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0;
             font-size:11.8px;line-height:1.5}
  .cfg-facts dt{color:var(--faint);white-space:nowrap}
  .cfg-facts dd{margin:0;color:var(--ink-2);font-weight:600;overflow-wrap:anywhere}
  .cfg-facts .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .cfg-facts .dot.ok{background:var(--ok)} .cfg-facts .dot.warn{background:var(--warn)}
  .cfg-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .cfg-actions .btn-primary,.cfg-actions .btn-ghost{display:inline-flex;align-items:center;gap:6px;
    text-decoration:none;justify-content:center}
  .cfg-actions .i{width:13px;height:13px}
  @media(max-width:900px){.tb-link span{display:none}}

  /* ================= request inspector ================= */
  .insp-btn{position:relative;background:none;border:0;font-family:inherit;cursor:pointer}
  .insp-btn .n{position:absolute;top:2px;right:2px;min-width:15px;height:15px;padding:0 4px;
    border-radius:99px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;
    line-height:15px;text-align:center;display:none;font-variant-numeric:tabular-nums}
  .insp-btn.has .n{display:block}
  .insp-mask{position:fixed;inset:0;background:rgba(24,24,27,.3);z-index:60;
    opacity:0;pointer-events:none;transition:opacity .22s var(--ease)}
  .insp-mask.on{opacity:1;pointer-events:auto}
  .insp-drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,94vw);z-index:61;
    background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;
    transform:translateX(102%);transition:transform .26s var(--ease);
    box-shadow:-18px 0 48px -24px rgba(24,24,27,.3)}
  .insp-drawer.on{transform:none}
  .insp-hd{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .insp-hd h3{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
  .insp-hd .cnt{font-size:11.5px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
  .insp-hd .sp{flex:1 1 auto}
  .insp-body{flex:1 1 auto;overflow:auto;padding:11px 13px 28px}
  .insp-empty{color:var(--faint);font-size:12.5px;text-align:center;padding:44px 14px;line-height:1.95}
  .insp-item{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);
    margin-bottom:8px;overflow:hidden}
  .insp-item[data-err="1"]{border-color:var(--err-line);background:var(--err-soft)}
  /* a record exists the moment the request leaves, not when it comes back */
  .insp-item[data-st="pending"]{border-color:var(--accent-line);background:var(--accent-soft)}
  .insp-sum{display:flex;align-items:center;gap:7px;padding:8px 10px;cursor:pointer;list-style:none;
    font-size:12px}
  .insp-sum::-webkit-details-marker{display:none}
  .insp-sum::marker{content:''}
  .insp-sum .no{font-variant-numeric:tabular-nums;color:var(--faint);font-size:11px;min-width:16px}
  .insp-sum .ep{font-weight:600;color:var(--ink-2);font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
  .insp-sum .md{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
  .insp-sum .sp{flex:1 1 auto}
  .insp-sum .st{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);white-space:nowrap}
  .insp-sum .st.ok{color:var(--ok)} .insp-sum .st.bad{color:var(--err)}
  .insp-sum .st.wip{color:var(--accent);text-transform:none}
  .insp-sum .st.wip::after{content:'';display:inline-block;width:5px;height:5px;border-radius:99px;
    background:currentColor;margin-left:6px;vertical-align:1.5px;animation:inspPulse 1s ease-in-out infinite}
  @keyframes inspPulse{0%,100%{opacity:.2}50%{opacity:1}}
  .insp-sum .im{width:13px;height:13px;flex:0 0 auto;fill:none;stroke:var(--ok);stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .insp-det{padding:0 10px 10px;border-top:1px solid var(--line)}
  .insp-det h5{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
    margin:10px 0 5px;display:flex;align-items:center;gap:7px;font-weight:600}
  .insp-det pre{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:9px 10px;font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:11px;
    line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;color:var(--ink-2)}
  .insp-copy{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;
    font-size:10.5px;padding:1px 6px;cursor:pointer;color:var(--muted);font-family:inherit;
    text-transform:none;letter-spacing:0}
  .insp-copy:hover{color:var(--ink);border-color:var(--ink-2)}
  /* the generated bitmap itself, so a run can be audited without leaving the drawer */
  .insp-pic{margin:2px 0 4px;border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--surface);padding:8px;display:flex;gap:10px;align-items:flex-start}
  .insp-pic .thumb{flex:0 0 auto;max-width:58%;line-height:0;cursor:zoom-in}
  .insp-pic img{max-width:100%;max-height:210px;border-radius:6px;display:block;
    object-fit:contain;background:#fff;border:1px solid var(--line)}
  .insp-pic .meta{flex:1 1 auto;min-width:0;font-size:10.5px;color:var(--faint);line-height:1.85}
  .insp-pic .meta b{display:block;color:var(--ink-2);font-size:11px;font-weight:600;
    word-break:break-all;margin-bottom:3px}
  .insp-dl{display:inline-flex;align-items:center;gap:4px;margin-top:6px;
    border:1px solid var(--line-2);background:var(--surface);border-radius:6px;
    font-size:10.5px;padding:3px 8px;color:var(--ink-2);text-decoration:none;
    font-weight:600;cursor:pointer;transition:color .16s,border-color .16s,background .16s}
  .insp-dl:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
  .insp-dl .i{width:11px;height:11px}
  .insp-foot{padding:9px 15px;border-top:1px solid var(--line);color:var(--faint);font-size:11px;flex:0 0 auto}

  /* ---------- settings overlay (设置页以浮层打开，工作台状态不卸载) ---------- */
  .set-wrap{position:fixed;inset:0;z-index:71;display:flex;align-items:center;justify-content:center;
    padding:18px;background:rgba(24,24,27,.42);opacity:0;pointer-events:none;
    transition:opacity .2s var(--ease)}
  .set-wrap.on{opacity:1;pointer-events:auto}
  .set-panel{position:relative;width:100%;max-width:1160px;height:100%;max-height:860px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 28px 70px -36px rgba(24,24,27,.45);
    transform:translateY(10px);transition:transform .24s var(--ease)}
  .set-wrap.on .set-panel{transform:none}
  .set-panel iframe{flex:1 1 auto;width:100%;border:0;display:block;background:var(--surface)}
  .set-bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;
    border-bottom:1px solid var(--line);background:var(--surface-2)}
  .set-bar b{font-size:12px;font-weight:650;color:var(--ink-2);letter-spacing:-.005em}
  .set-bar .sp{flex:1 1 auto}
  .set-bar button{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;
    color:var(--muted);background:var(--surface);border:1px solid var(--line-2);
    border-radius:var(--r-sm);padding:5px 9px;transition:color .16s,border-color .16s,background .16s}
  .set-bar button:hover{color:var(--ink);border-color:var(--ink-2);background:var(--surface)}
  .set-bar .i{width:12px;height:12px}

  /* ---------- reference lightbox ---------- */
  .lb{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;
    background:#0b0b0d;opacity:0;pointer-events:none;
    transition:opacity .18s var(--ease)}
  .lb.on{opacity:1;pointer-events:auto}
  .lb-bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px;color:#f4f4f5;
    border-bottom:1px solid rgba(255,255,255,.07)}
  .lb-bar .nm{font-size:12.5px;font-weight:600;max-width:52ch;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-bar .idx{font-size:11.5px;color:rgba(244,244,245,.62);font-variant-numeric:tabular-nums}
  .lb-bar .sp{flex:1 1 auto}
  .lb-btn{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
    color:rgba(244,244,245,.88);background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18);border-radius:var(--r-sm);padding:6px 10px;
    transition:background .16s,color .16s}
  .lb-btn:hover{background:rgba(255,255,255,.2);color:#fff}
  .lb-stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:14px 12px 18px;min-height:0;overflow:hidden}
  .lb-stage img{flex:1 1 auto;min-width:0;height:100%;object-fit:contain;border-radius:8px;
    background:transparent;cursor:zoom-in;
    filter:drop-shadow(0 18px 44px rgba(0,0,0,.55))}
  .lb-stage.actual{overflow:auto;align-items:flex-start}
  .lb-stage.actual img{flex:0 0 auto;width:auto;height:auto;max-width:none;max-height:none;
    margin:auto;border-radius:0;background:#fff;cursor:zoom-out;filter:none}
  .lb-nav{flex:0 0 auto;width:42px;height:88px;display:flex;align-items:center;justify-content:center;
    color:rgba(244,244,245,.82);background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.22);border-radius:11px;font-size:20px;line-height:1;
    transition:background .16s,color .16s}
  .lb-nav:hover{background:rgba(255,255,255,.26);color:#fff}
  .lb-nav[disabled]{opacity:.18;cursor:default}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-mark" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M7.5 15.5 12 8l4.5 7.5"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="16" r="3.6"/><path d="M10.6 13.4 19.5 4.5"/><path d="m16.5 7.5 2.5 2.5"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 21h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15.5-4.5-4.5L6 21"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.6 8.4-2.1 5.1-5.1 2.1 2.1-5.1z"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 1 9-9c0 2.1-1.7 3.2-3.4 3.2H16a2 2 0 0 0-1.4 3.4c.5.6.3 1.6-.7 2a9 9 0 0 1-1.9.4z"/><circle cx="8.6" cy="10.2" r=".95" fill="currentColor" stroke="none"/><circle cx="12" cy="7.6" r=".95" fill="currentColor" stroke="none"/><circle cx="15.4" cy="10.2" r=".95" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15.5V3.5"/><path d="m8 7.5 4-4 4 4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16.5v-5"/><circle cx="12" cy="8.2" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.2v2.1M12 18.7v2.1M4.8 4.8l1.5 1.5M17.7 17.7l1.5 1.5M3.2 12h2.1M18.7 12h2.1M4.8 19.2l1.5-1.5M17.7 6.3l1.5-1.5"/></symbol>
</defs></svg>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24"><use href="#i-mark"/></svg></span>
      <span class="brand-text">
        <span class="brand-title">超级AI绘图 <em>Beta</em></span>
        <span class="brand-sub" data-i18n="sub"></span>
      </span>
    </div>
    <nav class="flow-nav" id="flowNav">
      <a class="fn" href="#card1"><b>1</b><span data-i18n="nav1"></span></a>
      <a class="fn" href="#card3"><b>2</b><span data-i18n="nav2"></span></a>
      <a class="fn" href="#card4"><b>3</b><span data-i18n="nav3"></span></a>
    </nav>
    <button class="tb-link insp-btn" id="inspBtn" type="button" title="请求日志">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h11"/></svg>

/* 顶栏步骤条：按滚动位置高亮当前步骤（不触碰业务逻辑） */
(function(){
  var links = [].slice.call(document.querySelectorAll('#flowNav .fn'));
  if(!links.length) return;
  var items = links.map(function(a){ return document.getElementById(a.getAttribute('href').slice(1)); });
  var tick = false;
  function paint(){
    var best = 0, top = Infinity;
    items.forEach(function(el, i){
      if(!el) return;
      var r = el.getBoundingClientRect();
      if(r.bottom > 150 && r.top < top){ top = r.top; best = i; }
    });
    links.forEach(function(a, i){ a.classList.toggle('on', i === best); });
  }
  function onScroll(){
    if(tick) return;
    tick = true;
    requestAnimationFrame(function(){ tick = false; paint(); });
  }
  window.addEventListener('scroll', onScroll, {passive:true, capture:true});
  window.addEventListener('resize', onScroll, {passive:true});
  paint();
})();
</script>

/* Attach the picture a generation call produced, so the drawer shows the result
   itself. Kept as a blob URL, not a data URL: re-encoding megabytes of base64 on
   every repaint would stall the panel. */
async function inspAttachImage(rec, src, opts){
  const o = opts || {};
  try{
    if (!rec || !src) return;
    let blob;
    if (/^data:/i.test(src)) blob = await (await fetch(src)).blob();
    else {
      const res = await fetch(src);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      blob = await res.blob();
    }
    if (!INSPECT.items.includes(rec)) return;       // already rotated out
    if (!/^image\//.test(blob.type)){
      rec.imageError = tt('insp.imgUnsupported') + ' (' + (blob.type || '?') + ')';
      inspRender(); return;
    }
    if (blob.size > 24 * 1048576){
      rec.imageError = tt('insp.imgTooBig', { mb: (blob.size / 1048576).toFixed(1) });
      inspRender(); return;
    }
    const ext = blob.type.includes('webp') ? 'webp' : /jpe?g/.test(blob.type) ? 'jpg' : 'png';
    const prev = rec.image;
    rec.image = {
      url: URL.createObjectURL(blob),
      bytes: blob.size,
      type: blob.type,
      name: (o.name || ('figure-forge-' + rec.id)) + '.' + ext,
      w: o.width || 0,
      h: o.height || 0,
    };
    if (prev && prev.url){ try{ URL.revokeObjectURL(prev.url); }catch(_){} }
    inspTrimImages();
    inspRender();
  }catch(e){
    if (!rec) return;
    // Some providers answer with a hosted URL instead of base64; a CORS-blocked
    // fetch must not hide the picture from the log.
    if (/^https?:/i.test(String(src))){
      rec.image = { url: String(src), remote: true, bytes: 0, type: '',
        name: (o.name || ('figure-forge-' + rec.id)) + '.png', w: o.width || 0, h: o.height || 0 };
      inspRender(); return;
    }
    rec.imageError = tt('insp.imgFail') + ' ' + ((e && e.message) || e);

function inspFmtBytes(n){
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';

/* A run can produce tens of megabytes of drafts; keep the newest dozen attached

function inspTrimImages(){
  const live = INSPECT.items.filter(r => r.image && r.image.url && !r.image.remote);
  while (live.length > 12){
    const old = live.shift();
    try{ URL.revokeObjectURL(old.image.url); }catch(_){}
    old.image.url = '';
    old.image.released = true;

/* An image response is a single multi-megabyte base64 string; printing it would
   bury the rest of the payload. Fold long runs, then pretty-print what is left. */
function inspImageResp(text){
  const t = String(text || '');
  if (!t) return '[空响应]';
  const folded = t.replace(/"([A-Za-z0-9+/]{400,}={0,2})"/g,
    (m, b) => '"[base64 ' + b.length + ' 字符 · 见下方图片]"');
  let d = null;
  try{ d = JSON.parse(folded); }catch(_){}
  if (d) return inspMask(JSON.stringify(d, null, 2));
  return inspMask(folded.length > 4000 ? folded.slice(0, 4000) + '\n…（共 ' + folded.length + ' 字符）' : folded);
}
async function inspResponse(res){
  try{
    const ct = res.headers.get('content-type') || '';
    const len = Number(res.headers.get('content-length') || 0);
    if (len > 2000000) return '[响应过大，约 ' + Math.round(len / 1024) + ' KB，仅记录状态]';
    if (/event-stream/i.test(ct)) return '[流式响应，正文未捕获]';
    if (!/json|text|xml/i.test(ct)) return '[' + (ct || '二进制') + (len ? ' · ' + len + ' 字节' : '') + ']';
    const txt = await res.clone().text();
    if (!txt) return '[空响应]';
    try{ return inspMask(JSON.stringify(inspShrink(JSON.parse(txt)), null, 2)); }catch(_){}
    return inspMask(txt.length > 8000 ? txt.slice(0, 8000) + '\n…（共 ' + txt.length + ' 字符）' : txt);
  }catch(e){ return '[无法读取响应] ' + ((e && e.message) || ''); }
}

    err => { rec.status = 0; rec.resp = '[请求失败] ' + ((err && err.message) || err); inspCommit(rec); });

}

/* Show a single arbitrary picture (a generated draft from the request log) in the

function lightboxRequestClose(){

function lightboxStep(d){

let pdfContext = null;
let pdfIntentSeq = 0;
const TARGET_SECTION_HINTS = {
  overview:'研究问题、核心方法、主要贡献、主要结果与应用价值',
  architecture:'模型模块、编码器/解码器、组件连接关系、数据流与张量或输入输出',
  pipeline:'按顺序描述输入、处理步骤、模块之间的数据流和最终输出',

/* 解析作用可以绑到别的服务商：模型必须取自那个服务商自己的清单，不能回落到
   全局服务商（否则会把中转站的模型名发到另一家的接口上）。 */
function parserModel(){ return Store.effectiveParseModel(Store.roleProvider('parse') || Store.providerId()); }
function parserInstruction(target, query){
  const label=$('#target').selectedOptions[0]?.textContent||target;
  const detail=$('#targetDesc').value.trim();
  const focus=TARGET_SECTION_HINTS[target]||TARGET_SECTION_HINTS.overview;
  return `你是科研论文图表策划器。请阅读附带的 PDF 论文，为“${label}”生成可靠的绘图内容提纲。${detail?`用户补充要求：${detail}。`:''}${query?`需要优先定位：${query}。`:''}\n目标重点：${focus}。\n请从论文实际内容中选择最相关的章节和连续段落。优先归纳明确的绘图要求、方法流程、关键模块及其输入输出、必要的结果和数字；标题、摘要和其他背景只保留理解图所必需的部分。selectedSections 按绘图相关性排序，不按论文页码排序；figurePrompt 应独立、具体，包含画图需要的论文事实。忠实于原文，不得编造。输出严格 JSON，不要 Markdown：{"title":"论文标题","abstract":"摘要或摘要要点","selectedSections":[{"section":"章节名/页码","summary":"该段落对绘图有用的忠实归纳","evidence":"可核对的原文短句或页码"}],"figurePrompt":"一段可直接交给出图模型的具体中文或英文提示词"}`;
}
function parseResponseText(d){
  if(d?.output_text) return d.output_text;
  if(Array.isArray(d?.output)) return d.output.flatMap(x=>x.content||[]).map(x=>x.text||'').join('');
  if(Array.isArray(d?.content)) return d.content.filter(x=>x.type==='text').map(x=>x.text||'').join('');
  return d?.choices?.[0]?.message?.content||'';
}
function pdfDataPart(){ return dataURIToParts(pdfContext.dataUri); }
/* ---- local PDF text extraction (transport only: the model still picks and
   summarises the sections; used when a provider refuses a document part) ---- */
const MAX_PDF_CHARS = 60000;
const MAX_PDF_IMAGES = 8;
function relevantPdfText(text, target, query){
  if(text.length<=MAX_PDF_CHARS) return text;
  const pages=text.split(/(?=【第 \d+ 页】)/).filter(Boolean);
  if(pages.length<2) return text.slice(0,MAX_PDF_CHARS);
  const terms=['figure','diagram','illustrat','visualiz','method','approach','framework','architecture','pipeline','workflow','module','component','input','output','result','experiment','ablation','图','方法','流程','框架','架构','模块','输入','输出','结果','实验','消融'];
  if(target==='results') terms.push('benchmark','metric','accuracy','performance','指标','性能','对比');
  const requested=(query||'').toLowerCase().split(/[\s,，;；、]+/).filter(x=>x.length>1).slice(0,8);
  const ranked=pages.map((page,index)=>{
    const body=page.toLowerCase();
    const score=terms.reduce((sum,term)=>sum+(body.includes(term)?1:0),0)
      +requested.reduce((sum,term)=>sum+(body.includes(term)?4:0),0);
    return {page,index,score};
  }).sort((a,b)=>b.score-a.score||a.index-b.index);
  let used=0;
  return ranked.map(({page},index)=>{
    const separator=index?2:0;
    const remaining=MAX_PDF_CHARS-used-separator;
    if(remaining<=0) return '';
    const part=page.slice(0,remaining);
    used+=part.length+separator;
    return part;
  }).filter(Boolean).join('\n\n');
}
let pdfjsPromise = null;
function loadPdfjs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsPromise) return pdfjsPromise;
  pdfjsPromise = new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='./vendor/pdf.min.js';
    s.onload=()=>{
      if(!window.pdfjsLib) return reject(new Error('pdf.js 加载失败'));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('./vendor/pdf.worker.min.js', document.baseURI).href;
      resolve(window.pdfjsLib);
    };
    s.onerror=()=>reject(new Error('pdf.js 加载失败'));
    document.head.appendChild(s);
  });
  return pdfjsPromise;
}
let pdfText = null, pdfImgs = null;
function pdfBytes(){
  // pdf.js takes ownership of the buffer it is given (it transfers it to the
  // worker), so every call has to hand over an independent copy — otherwise a
  // second extraction (text, then page images) fails on a detached buffer.
  if(pdfContext.buf) return new Uint8Array(pdfContext.buf.slice(0));
  const part = pdfDataPart(); if(!part) throw new Error(tt('ps.nodata'));
  const bin = atob(part.data); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
async function extractPdfText(){
  if(pdfText && pdfText.name===pdfContext.fileName) return pdfText;
  const lib = await loadPdfjs();
  const doc = await lib.getDocument({data: pdfBytes(), isEvalSupported:false}).promise;
  const pages = [];
  for(let p=1;p<=doc.numPages;p++){
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    pages.push('【第 '+p+' 页】\n'+tc.items.map(i=>i.str).join(' '));
  }
  const text = pages.join('\n\n').replace(/[ \t]{2,}/g,' ').trim();
  pdfText = {name:pdfContext.fileName, text, chars:text.length, pages:doc.numPages};
  return pdfText;
}
/* Page images: the universal channel for vision models — works for scanned
   papers and keeps layout, figures and tables readable. */
async function extractPdfImages(){
  if(pdfImgs && pdfImgs.name===pdfContext.fileName) return pdfImgs;
  const lib = await loadPdfjs();
  const doc = await lib.getDocument({data: pdfBytes(), isEvalSupported:false}).promise;
  const n = Math.min(doc.numPages, MAX_PDF_IMAGES);
  const imgs = [];
  for(let p=1;p<=n;p++){
    const page = await doc.getPage(p);
    const base = page.getViewport({scale:1});
    const scale = Math.max(1, Math.min(1.6, 1400/Math.max(base.width, base.height)));
    const vp = page.getViewport({scale});
    const cv = document.createElement('canvas');
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    imgs.push(cv.toDataURL('image/jpeg', 0.72));
  }
  pdfImgs = {name:pdfContext.fileName, imgs, pages:n, total:doc.numPages};
  return pdfImgs;
}
function showParseErr(msg){ const el=$('#parseErr'); if(!el) return; el.innerHTML=esc(tt('ps.errline',{m:msg})); el.hidden=false; }
function clearParseErr(){ const el=$('#parseErr'); if(el) el.hidden=true; }
function extractJsonObject(txt){
  const clean=(txt||'').replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
  const m=clean.match(/\{[\s\S]*\}/); if(!m) throw new Error('解析模型未返回 JSON');
  try{return JSON.parse(m[0]);}catch(e){throw new Error('解析模型返回的 JSON 无法读取');}
}
/* Which document channel does the selected provider/base URL really accept?
   Providers with an OpenAI-compatible /responses route (verified to exist on
   OpenAI, Ark, GLM and Qwen) may take the PDF natively through `input_file`;
   Anthropic takes a `document` block; a relay/custom base takes the file part.
   Everything else goes through locally extracted text or page images. */
function docMode(R){
  R = R || roleRoute('parse');
  const c=R.cfg, base=R.base, p=R.provider;
  if(R.override) return 'oai_file';
  if(c.proto==='anthropic') return modelSeesImages(R) ? 'anthropic' : 'none';
  if((/openai\.com/i.test(base) || flagsOf(p).responsesDoc) && modelSeesImages(R)) return 'openai_responses';
  return 'none';
}
/* Conservative capability check: the manifest lists text-only models in chat,
   vision-capable ones in vision. Unknown ids are given the benefit of the doubt. */
function modelSeesImages(R){
  R = R || roleRoute('parse');
  const m=R.model||parserModel()||'', c=R.cfg;
  if((c.vision||[]).includes(m)) return true;
  if((c.chat||[]).includes(m)) return false;
  return /vl|vision|visual|gpt-|claude|gemini|seed|qwen|glm|hunyuan|kimi|image/i.test(m);
}
function anthropicHeaders(key){
  return {'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'};
}
/* mode: 'doc' native document part · 'text' locally extracted text ·
   'img' locally rendered page images (vision models) */
// Apply at each request boundary; image generation and connection probes stay independent.
function reasoningEffort(scope){
  if(scope==='parse') return Store.parseEffort();
  if(scope==='recon') return Store.reconEffort();
  return Store.visualEffort();
}
function withReasoning(body,scope){
  const effort=reasoningEffort(scope);
  if(!effort) return body;
  if(!Store.EFFORTS.includes(effort)) throw new Error('HTTP 400: 无效的推理强度');
  if(body.system) throw new Error('HTTP 400: 当前 Anthropic 接口不支持 reasoning_effort，请选择服务商默认。');
  const result={...body};
  if(body.input) result.reasoning={...body.reasoning,effort};
  else result.reasoning_effort=effort;
  delete result.temperature;
  delete result.top_p;
  delete result.thinking;
  if(!body.input && /^(gpt-|o[134](?:-|$))/i.test(body.model) && body.max_tokens){
    result.max_completion_tokens=body.max_tokens;
    delete result.max_tokens;
  }
  return result;
}
$('#reconReasoningEffort').value = Store.reconEffort();
$('#reconReasoningEffort').onchange = e=>Store.setReconEffort(e.target.value);

async function callPdfParser(mode, payload){
  const R=roleRoute('parse');
  const c=R.cfg, base=R.base, key=R.key, model=R.model||parserModel();
  if(!base||!key) throw new Error(tt('ps.nocfg'));
  /* 模型为空与服务商没配是两件事：报成一件事会让人去改已经填好的地址和 Key。 */
  if(!model) throw new Error(tt('ps.nomodel',{p:R.label||'–'}));
  // Isolated PDF-only official Responses transport; shared generation/export stays unchanged.
  const officialPdf = async body => {
    const {requestOpenAIPdf}=await import('./pdf-openai-api.mjs?v=20261028-pdf1');
    return requestOpenAIPdf(base,withReasoning(body,'parse'),key,{fetchImpl:fetchWithTimeout});
  };
  const instruction=parserInstruction($('#target').value,$('#contentQuery').value.trim());
  let r, body;
  if(mode==='text'){
    const ex=payload;
    const text = instruction+'\n\n'+tt('ps.texthdr',{f:pdfContext.fileName,p:ex.pages})+'\n'+relevantPdfText(ex.text,$('#target').value,$('#contentQuery').value.trim());
    if(c.proto==='anthropic'){
      body={model,max_tokens:5000,system:'只输出严格 JSON。',messages:[{role:'user',content:[{type:'text',text}]}]};
      r=await fetchWithTimeout(base+'/v1/messages',{method:'POST',headers:anthropicHeaders(key),body:JSON.stringify(withReasoning(body,'parse'))},Infinity);
    }else if(/openai\.com/i.test(base)){
      body={model,input:[{role:'user',content:[{type:'input_text',text}]}],max_output_tokens:5000};
      return officialPdf(body);
    }else{
      body={model,temperature:0.1,max_tokens:5000,messages:[{role:'system',content:'只输出严格 JSON。'},{role:'user',content:text}]};
      if((R.flags||{}).disableThinking && !R.relay) body.thinking={type:'disabled'};
      r=await postJSON(base,'/chat/completions',withReasoning(body,'parse'),key);
    }
  }else if(mode==='img'){
    const ex=payload;
    const note = instruction+'\n\n'+tt('ps.imgthdr',{f:pdfContext.fileName,p:ex.pages,t:ex.total});
    if(c.proto==='anthropic'){
      const blocks=ex.imgs.map(u=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:dataURIToParts(u).data}}));
      blocks.push({type:'text',text:note});
      body={model,max_tokens:5000,system:'只输出严格 JSON。',messages:[{role:'user',content:blocks}]};
      r=await fetchWithTimeout(base+'/v1/messages',{method:'POST',headers:anthropicHeaders(key),body:JSON.stringify(withReasoning(body,'parse'))},Infinity);
    }else if(/openai\.com/i.test(base)){
      const content=ex.imgs.map(u=>({type:'input_image',image_url:u}));
      content.push({type:'input_text',text:note});
      body={model,input:[{role:'user',content}],max_output_tokens:5000};
      return officialPdf(body);
    }else{
      const content=ex.imgs.map(u=>({type:'image_url',image_url:{url:u}}));
      content.push({type:'text',text:note});
      body={model,temperature:0.1,max_tokens:5000,messages:[{role:'system',content:'只输出严格 JSON。'},{role:'user',content}]};
      if((R.flags||{}).disableThinking && !R.relay) body.thinking={type:'disabled'};
      r=await postJSON(base,'/chat/completions',withReasoning(body,'parse'),key);
    }
  }else{
    // Native document part — shape depends on what the endpoint accepts.
    const dm=docMode(R);
    const part=pdfDataPart(); if(!part) throw new Error(tt('ps.nodata'));
    if(dm==='anthropic'){
      const blocks=[{type:'document',source:{type:'base64',media_type:part.media||'application/pdf',data:part.data}},
                    {type:'text',text:instruction}];
      body={model,max_tokens:5000,system:'只输出严格 JSON。',messages:[{role:'user',content:blocks}]};
      r=await fetchWithTimeout(base+'/v1/messages',{method:'POST',headers:anthropicHeaders(key),body:JSON.stringify(withReasoning(body,'parse'))},Infinity);
    }else if(dm==='openai_responses'){
      body={model,input:[{role:'user',content:[{type:'input_file',filename:pdfContext.fileName,file_data:pdfContext.dataUri},{type:'input_text',text:instruction}]}],max_output_tokens:5000};
      if(new URL(base).origin==='https://api.openai.com') return officialPdf(body);
      r=await fetchWithTimeout(base+'/responses',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify(withReasoning(body,'parse'))},Infinity);
    }else{
      body={model,temperature:0.1,max_tokens:5000,messages:[{role:'system',content:'只输出严格 JSON。'},{role:'user',content:[{type:'file',file:{filename:pdfContext.fileName,file_data:pdfContext.dataUri}},{type:'text',text:instruction}]}]};
      r=await postJSON(base,'/chat/completions',withReasoning(body,'parse'),key);
    }
  }
  const raw=await r.text(); if(!r.ok) throw new Error(friendlyHttp(r.status,raw,R.provider));
  try{ return pdfResponseJSON(JSON.parse(raw)); }
  catch(error){
    if(!error.pdfFormatFailure || !body?.messages || c.proto==='anthropic') throw error;
    // One format recovery; preserve the selected model, paper and references.
    const repaired=pdfRepairBody(withReasoning(body,'parse'));
    const retry=await postJSON(base,'/chat/completions',repaired,key);
    const retryRaw=await retry.text();
    if(!retry.ok) throw new Error(friendlyHttp(retry.status,retryRaw,R.provider));
    return pdfResponseJSON(JSON.parse(retryRaw));
  }
}
function renderPdfSummary(data){
  const sections=Array.isArray(data.selectedSections)?data.selectedSections.filter(x=>x&&x.summary).slice(0,6):[];
  if(!sections.length) throw new Error('解析模型没有返回相关章节摘要');
  const pieces=[data.figurePrompt&&`绘图提示词：${data.figurePrompt}`,sections.map(x=>`【${x.section||'相关章节'}】${x.summary}${x.evidence?`\n证据：${x.evidence}`:''}`).join('\n\n'),data.title&&`标题：${data.title}`,data.abstract&&`摘要要点：${data.abstract}`].filter(Boolean);
  $('#paper').value=pieces.join('\n\n').slice(0,12000);
}
function setParseStatus(state){
  const el=$('#contentModeHint'); el.dataset.state=state;
  el.dataset.label={idle:tt('hint.label'),loading:tt('ps.loading'),success:tt('ps.success'),error:tt('ps.error')}[state];
}
async function selectPdfContext(){
  if(!pdfContext || $('#contentMode').value==='free') return;
  const seq=++pdfIntentSeq;
  const setHint = (key,vars)=>{ setParseStatus('loading'); $('#contentModeHint').textContent=tt(key,vars||{}); };
  clearParseErr();
  setHint('ps.sending');
  setExtractMetaKey('ps.meta1', {m:parserModel()||'–'}, false);
  // Channel order: the provider's own document part when it has one, then the
  // locally extracted text, then rendered page images (vision models).
  const order=[];
  if(docMode()!=='none') order.push('doc');
  order.push('text');
  if(modelSeesImages()) order.push('img');
  const failures=[];
  try{
    let result=null, used=null;
    for(const ch of order){
      if(seq!==pdfIntentSeq) return;
      try{
        let payload=null;
        if(ch==='text'){
          setHint('ps.extracting');
          setExtractMetaKey('ps.meta1b', {m:parserModel()||'–'}, false);
          payload = await extractPdfText();
          if(payload.chars < 200){                       // scanned / image-only PDF
            failures.push(tt('ps.scanned',{m:failures[0]||'–'}).replace(/[。．.\s]+$/,''));
            continue;
          }
        }else if(ch==='img'){
          setHint('ps.rendering');
          setExtractMetaKey('ps.meta1c', {m:parserModel()||'–'}, false);
          payload = await extractPdfImages();
        }
        result = await callPdfParser(ch, payload);
        used = ch;
        break;
      }catch(e){
        if(seq!==pdfIntentSeq) return;
        if(e.stopPdfFallback) throw e;
        const label = ch==='img'?tt('ps.modeImg'):ch==='text'?tt('ps.modeText'):tt('ps.modeDoc');
        failures.push(label+': '+String(e.message||e).replace(/[。．.；;\s]+$/,''));
      }
    }
    if(!result) throw new Error(tt('ps.allfailed',{m:parserModel()||'–',e:failures.join('；')}));
    if(seq!==pdfIntentSeq) return;
    renderPdfSummary(result);
    setParseStatus('success');
    $('#contentModeHint').textContent=tt('ps.done');

/* ---------------- reference images -> data URI ---------------- */
function fileToDataURI(blob){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = ()=>resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}
async function blobToShrunkURI(blob, maxSide=1280){
  if(blob.type==='image/gif' || blob.type==='image/svg+xml') return fileToDataURI(blob);
  try{
    const bmp = await createImageBitmap(blob);
    const s = Math.min(1, maxSide/Math.max(bmp.width,bmp.height));
    const w=Math.max(1,Math.round(bmp.width*s)), h=Math.max(1,Math.round(bmp.height*s));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h);
    bmp.close && bmp.close();
    return cv.toDataURL('image/jpeg',0.82);
  }catch(e){ return fileToDataURI(blob); }
}
async function refDataURIs(refIds){
  const out = [];
  for(const id of (refIds||[...refs])){
    const f = referenceFigure(id);
    const r = await fetch(referenceURL(f));
    if(!r.ok) throw new Error(tt('ref.fail',{f:f.image}));
    out.push(await blobToShrunkURI(await r.blob()));
  }
  return out;
}
/* Preserve the generated bitmap for later vector reconstruction/export. The
   older helper above intentionally shrinks JPEGs for ordinary generation, but
   shrinking before OCR/geometry extraction destroys the small labels and tiles
   that the editable export needs. */
async function refDataURIsOriginal(refIds){
  const out = [];
  for(const id of (refIds||[...refs])){
    const f = referenceFigure(id);
    if(!f) continue;
    const r = await fetch(referenceURL(f));
    if(!r.ok) throw new Error(tt('ref.fail',{f:f.image}));
    out.push(await fileToDataURI(await r.blob()));
  }
  return out;
}
function dataURIToParts(uri){
  const m = uri.match(/^data:(.*?);base64,(.*)$/);
  return m ? {media:m[1]||'image/jpeg', data:m[2]} : null;
}

const ANALYZE_SYS = 'You are an expert scientific-figure design analyst. You receive several top-conference figures of the SAME target visual type. Infer the shared visual grammar across all supplied figures: recurring panel divisions, density, element counts, borders, arrows, palette, typography and hierarchy. Do not treat any single figure as a layout master and do not copy a particular figure. Return STRICT JSON only.';
const RECON_SYS = 'You are a meticulous scientific-figure vectorization service. Reconstruct the supplied figure as a complete editable scene, preserving every visible primitive and its geometry. Return STRICT JSON only, never markdown or commentary. Never replace the scene with one full-canvas bitmap; split panels, borders, arrows, text, icons, charts and image regions into separate nodes.';
function buildAnalyzePrompt(n, idList){

            "variety":"the kinds of visual modules present and how neighbouring modules differ",
 "fill":"one sentence describing how fully the typical boxes are occupied"},
 "strokes":{"box":0,"arrow":0,"connector":0},
 "typography":{"title":0,"panelHeader":0,"label":0,"note":0},
 "palette":{"background":"#hex","primary":"#hex","accent":"#hex","neutral":"#hex","others":["#hex"]},
 "layout":"how the canvas is divided (number/arrangement of panels) and reading direction",
 "panels":[{"name":"panel name","role":"what this panel shows","x":0,"y":0,"w":0,"h":0}],
 "layoutBlueprint":[{"id":"zone-1","role":"what this concrete zone or slot contains","x":0,"y":0,"w":0,"h":0,"moduleCount":0,"occupancy":0,"moduleKinds":["icon","chart"],"nesting":"local nesting","flow":"local reading direction"}],
 "topology":{"anchor":"the recurring composition grammar shared by the figures","zones":"relative columns/rows and nesting that recur","flow":"reading direction and connector routes","spacing":"gaps, margins and whitespace rhythm"},
 "styleFingerprint":{"background":"surface treatment","panelShape":"corner radius and container treatment","moduleShape":"module box treatment","iconStyle":"icon/illustration language","arrowStyle":"arrow and connector language","textTreatment":"title, header and label treatment"},
 "elements":"recurring visual elements: box styles, arrow types, icon/illustration conventions",

palette: every value MUST be a real #rrggbb hex string.

strokes: integer pixel widths (box 2-4, arrow 2-4, connector 1-3).
density: COUNT what you actually see, as integers. Use the median only for genuinely shared quantities; keep the strongest recurring topology and density when the figures differ materially — never report 0 for something you can see:
  containers  how many outer panel/container boxes one typical figure has,

  fill  one sentence on how FULL the boxes are in these figures — how much of a typical box is

Available figure ids: ${ids}
topology, styleFingerprint and refinedPrompt must describe visible layout and styling, not the paper's scientific claims. refinedPrompt should be 120-180 concrete English words about panels, arrows, palette, spacing, hierarchy and illustration language. It is used as a visual guide, not as a request to copy reference labels. Keep the prose compact so the whole JSON answer fits in one response.`;
}
function jsonCandidateSlices(txt){
  const s=String(txt||'');
  const out=[];
  const pairs={'{':'}','[':']'};
  for(let start=0;start<s.length;start++){
    if(s[start]!=='{' && s[start]!=='[') continue;
    const stack=[];
    let inStr=false,esc=false;
    for(let i=start;i<s.length;i++){
      const c=s[i];
      if(inStr){
        if(esc) esc=false;
        else if(c==='\\') esc=true;
        else if(c==='"') inStr=false;
        continue;
      }
      if(c==='"'){ inStr=true; continue; }
      if(c==='{' || c==='[') stack.push(pairs[c]);
      else if(c==='}' || c===']'){
        if(!stack.length || stack.pop()!==c) break;
        if(!stack.length){ out.push(s.slice(start,i+1)); break; }
      }
    }
  }
  return out;
}
function closeJsonCandidate(txt){
  let s=String(txt||'').trim().replace(/,\s*([}\]])/g,'$1');
  const stack=[],pairs={'{':'}','[':']'};
  let inStr=false,esc=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(inStr){
      if(esc) esc=false;
      else if(c==='\\') esc=true;
      else if(c==='"') inStr=false;
      continue;
    }
    if(c==='"'){ inStr=true; continue; }
    if(c==='{' || c==='[') stack.push(pairs[c]);
    else if(c===']' || c==='}'){
      if(stack.length && stack[stack.length-1]===c) stack.pop();
    }
  }
  if(inStr){
    const quote=s.lastIndexOf('"');
    if(quote>0) s=s.slice(0,quote);
  }
  s=s.replace(/,\s*("[^"]*")\s*:\s*[^,}\]]*$/,'');
  s=s.replace(/,\s*$/,'');
  while(stack.length) s+=stack.pop();
  return s;
}
function extractJSON(txt){
  const fence=String.fromCharCode(96);
  const s=String(txt||'').trim()
    .replace(new RegExp(fence+'{3}(?:json)?','ig'),'')
    .replace(new RegExp(fence+'{3}','g'),'')
    .trim();
  const candidates=jsonCandidateSlices(s);
  for(const cand of candidates){
    try{ return JSON.parse(cand); }catch(e){}
    try{ return JSON.parse(cand.replace(/,\s*([}\]])/g,'$1')); }catch(e){}
    try{ return JSON.parse(closeJsonCandidate(cand)); }catch(e){}
  }
  const first=s.search(/[{\[]/);
  if(first>=0){
    try{ return JSON.parse(closeJsonCandidate(s.slice(first))); }catch(e){}
  }
  throw new Error(tt('err.analyze2'));
}
async function analyzeReferences(){
  const ordered=[...refs];
  const uris=await refDataURIs();
  const R=roleRoute('analyze');
  const c=R.cfg, relay=R.relay;
  const useAnthropic=c.proto==='anthropic'&&!relay;
  let txt;
  if(useAnthropic){
    const blocks=uris.map(u=>{const p=dataURIToParts(u);return {type:'image',source:{type:'base64',media_type:p.media,data:p.data}};});
    blocks.push({type:'text',text:buildAnalyzePrompt(ordered.length, ordered)});
    const body={model:R.model,max_tokens:16000,system:ANALYZE_SYS,messages:[{role:'user',content:blocks}]};
    const r=await fetchWithTimeout(R.base+'/v1/messages',{method:'POST',headers:anthropicHeaders(R.key),body:JSON.stringify(withReasoning(body,'visual'))});
    txt=await r.text(); if(!r.ok) throw new Error(friendlyHttp(r.status,txt,R.provider));
    const d=JSON.parse(txt); txt=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  }else{
    const am = R.model;
    if(!am) throw new Error(tt('analyze.needmodel'));
    const parts=uris.map(u=>({type:'image_url',image_url:{url:u}}));
    parts.push({type:'text',text:buildAnalyzePrompt(ordered.length, ordered)});
    const body={model:am,temperature:0.2,max_tokens:16000,messages:[{role:'system',content:ANALYZE_SYS},{role:'user',content:parts}]};
    if((R.flags||{}).disableThinking && !R.relay) body.thinking={type:'disabled'};
    let r;
    try{ r=await postJSON(R.base,'/chat/completions',withReasoning(body,'visual'),R.key); }
    catch(e){
      if(e.name==='TimeoutError') throw new Error(tt('analyze.timeout'));
      const diag=await diagnoseConnection(R.base,R.key,am,'chat',R.provider);
      throw new Error(diag || tt('analyze.blocked'));
    }
    txt=await r.text(); if(!r.ok) throw new Error(friendlyHttp(r.status,txt,R.provider));
    const d=JSON.parse(txt);
    if(d.choices?.[0]?.finish_reason==='length') throw new Error(tt('err.analyze3'));
    txt=d.choices?.[0]?.message?.content||'';
  }
  const j=extractJSON(txt);
  // Representative figures may come back as ids (preferred, unambiguous) or as
  // 1-based indices (older models). Accept either, but only ids that really exist
  // in the analysed set, so a miscount can no longer silently pick the wrong figure.
  const validIds = [...new Set(ordered)].filter(id=>!!referenceFigure(id));
  const resolveRefId = x=>{
    const s=String(x).trim();
    if(validIds.includes(s)) return s;
    const n=+s;
    return Number.isInteger(n)&&n>=1&&n<=validIds.length ? validIds[n-1] : null;
  };
  let reps=(Array.isArray(j.representative)?j.representative:[]).map(resolveRefId).filter(Boolean);
  reps=[...new Set(reps)].slice(0,4);
  if(reps.length<2) reps=[...new Set(validIds)].slice(0,4);
  let imageRefIds=(Array.isArray(j.imageRefIds)?j.imageRefIds:[]).map(resolveRefId).filter(Boolean);
  imageRefIds=[...new Set(imageRefIds)].slice(0,3);
  if(!imageRefIds.length) imageRefIds=reps.slice(0,3);
  // Kept for backwards-compatible UI metadata only; it is never used as a
  // composition authority or forced into the selected reference set.
  j.primaryId=reps[0] || validIds[0] || null;
  // Two style guides, because the two output paths consume them differently.
  const contract = designContractText(j);
  const imageContract = designContractText(j, $('#figureRatio').value);
  const prose = (j.refinedPrompt||'').trim();
  const styleRows = imageStyleText(j);
  const measured = styleRows.length
    ? 'Measured from the chosen reference figures — follow these:\n' + styleRows.join('\n')
    : '';
  analysis={
    j, repIds:reps, imageRefIds,
    // SVG generation is measured and audited shape by shape, so it takes the prose
    // style description AND the precise contract: the hex values, panel coordinates
    // and type scale are what the geometry audit can actually check.
    refinedPrompt:[measured, contract, prose].filter(s=>s && s.trim()).join('\n\n'),
    // The bitmap path gets the measured values too, but phrased rather than pinned
    // to coordinates. Leaving them out is what made earlier drafts ignore the chosen

function paletteMarkup(palette){
  const entries=[];
  if(Array.isArray(palette)){
    palette.forEach((value,index)=>entries.push([`color ${index+1}`,value]));
  }else if(palette && typeof palette==='object'){
    ['background','primary','accent','neutral'].forEach(key=>{
      if(palette[key]) entries.push([key,palette[key]]);
    });
    if(Array.isArray(palette.others)){
      palette.others.forEach((value,index)=>entries.push([`other ${index+1}`,value]));
    }
  }else if(palette){
    return `<span>${esc(String(palette))}</span>`;
  }
  if(!entries.length) return '<span>–</span>';
  return `<span class="palette-list">${entries.map(([name,value])=>{
    const raw=String(value).trim();
    const safe=esc(raw);
    const swatch=/^#[0-9a-f]{3,8}$/i.test(raw)
      ? `<i class="palette-swatch" style="background:${safe}" aria-hidden="true"></i>` : '';
    return `<span class="palette-chip">${swatch}<span>${esc(name)} <code>${safe}</code></span></span>`;
  }).join('')}</span>`;
}

function imageStyleText(j){

  const pal = j.palette;
  if(pal && !Array.isArray(pal) && typeof pal === 'object'){

    const extra = Array.isArray(pal.others) ? pal.others.join(', ') : '';
    if(used.length || extra) rows.push(`- palette: ${used.concat(extra?[extra]:[]).join(', ')}`);
  } else if(Array.isArray(pal) && pal.length){
    rows.push(`- palette: ${pal.join(', ')}`);
  }
  const ty = j.typography;
  if(ty && typeof ty === 'object'){
    const scale = ['title','panelHeader','label','note'].filter(k=>ty[k]!=null).map(k=>`${k} ${ty[k]}px`);
    if(scale.length) rows.push(`- type scale: ${scale.join(', ')} (keep this hierarchy: the title clearly largest, panel headers next, then labels, then small notes)`);
  }

  if(st && typeof st === 'object'){

    if(w.length) rows.push(`- stroke weights: ${w.join(', ')}`);
  }
  const dn = j.density;
  if(dn && typeof dn === 'object'){
    const bits = [];
    if(dn.containers != null) bits.push(`${dn.containers} container boxes`);
    if(dn.modulesPerPanel != null) bits.push(`${dn.modulesPerPanel} module boxes per panel`);
    if(dn.solidBorders != null || dn.dashedBorders != null)
      bits.push(`${dn.solidBorders||0} solid and ${dn.dashedBorders||0} dashed borders`);
    if(dn.connectors != null) bits.push(`${dn.connectors} separate arrows/connectors`);
    if(dn.boxFillPercent != null) bits.push(`boxes about ${dn.boxFillPercent}% filled with content`);
    if(dn.variety != null) bits.push(`visual variety target: ${dn.variety}`);
    if(dn.fill != null) bits.push(`overall canvas fill target: ${dn.fill}`);
    if(bits.length) rows.push(`- counted in a typical reference figure: ${bits.join(', ')} — match these counts`);
    if(dn.nesting) rows.push(`- nesting: ${dn.nesting}`);
  }
  if(j.elements) rows.push(`- recurring elements: ${j.elements}`);
  if(j.hierarchy) rows.push(`- hierarchy: ${j.hierarchy}`);
  if(j.layout) rows.push(`- panel division and reading direction: ${j.layout}`);
  if(j.topology && typeof j.topology==='object'){
    const top = [];

    if(j.topology.flow) top.push('flow: '+j.topology.flow);

    if(top.length) rows.push('- shared topology (preserve recurring relationships while composing fresh content; do not invent a generic sparse grid): '+top.join('; '));
  }
  if(j.styleFingerprint && typeof j.styleFingerprint==='object'){
    const sf = ['background','panelShape','moduleShape','iconStyle','arrowStyle','textTreatment'].filter(k=>j.styleFingerprint[k]).map(k=>k+': '+j.styleFingerprint[k]);
    if(sf.length) rows.push('- style fingerprint: '+sf.join('; '));

  if(Array.isArray(j.panels) && j.panels.length){

function friendlyHttp(status, txt, prov){
  let code='', body='';
  try{ const d=JSON.parse(txt); code=d.error?.code||d.code||''; body=(d.error?.message||d.message||''); }catch{}
  if(code==='AccountOverdueError' || /overdue|欠费|余额不足/i.test(txt)) return tt('err.overdue')+apiContext(prov);
  if(status===401) return tt('err.401')+apiContext(prov);
  if(status===404){
    // Ark (and Hunyuan) cannot be listed from the browser, so a wrong pick can only be
    // discovered here: Ark answers 404 ModelNotOpen until the model is activated in the
    // console — spell that out instead of a bare "not found".
    if(flavorOf(prov)==='ark' || /ModelNotOpen/i.test(txt))
      return tt('err.notopen',{t:txt.slice(0,160)})+apiContext(prov);
    if(/not activated|is not open|未开通|not enabled/i.test(txt))
      return tt('err.notenabled',{t:txt.slice(0,160)})+apiContext(prov);
    return tt('err.404')+apiContext(prov);
  }
  if(imageFailureKind(status,txt)==='upstream') return tt('img.upstream',{t:txt.slice(0,500)})+apiContext(prov);
  if(status===429) return tt('err.429')+apiContext(prov);
  if(flavorOf(prov)==='infistar' && status===422)
    return tt('err.infistar422',{t:body||txt.slice(0,200)})+apiContext(prov);
  if(flavorOf(prov)==='infistar' && status===503 && /No available (?:compatible accounts|channel)|model_not_found/i.test(body||txt))
    return tt('err.infistar503')+' '+(body||txt).slice(0,500)+apiContext(prov);
  if(status===504) return tt('err.gatewayTimeout',{t:(body||txt).slice(0,500)})+apiContext(prov);
  if(status===403){
    // SiliconFlow answers 403 {"code":30003,"message":"Model disabled."} when a model
    // needs real-name verification or is switched off for the account; other providers
    // say "no access to model" / "not enabled". Give the actionable wording.
    if(String(code)==='30003' || /model disabled|not enabled|does not have access|no access to model|未开通|无权限/i.test(body||txt))
      return tt('err.forbidden',{t:txt.slice(0,200)})+apiContext(prov);
    return tt('err.403',{t:txt.slice(0,200)})+apiContext(prov);
  }
  if(status===400) return tt('err.400',{t:txt.slice(0,200)})+apiContext(prov);
  return tt('err.http',{s:status,t:txt.slice(0,200)})+apiContext(prov);
}

// Keep the timer active while the response body streams. A fulfilled fetch()

async function fetchTextWithTimeout(url, options={}, timeoutMs=Infinity){

  const cancel=()=>ac.abort();

  if(options.signal?.aborted)ac.abort();
  const to=Number.isFinite(timeoutMs)?setTimeout(()=>ac.abort(),timeoutMs):null;
  try{
    const started=now();
    const r=await fetch(url,{...options,signal:ac.signal});
    const headersMs=now()-started;

    if(r.body?.getReader){
      const reader=r.body.getReader(),decoder=new TextDecoder();
