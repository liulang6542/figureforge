<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FigureForge · 上传参考图画自己的主图</title>
<meta name="description" content="FigureForge：输入论文内容、上传自己的参考图，生成论文 Figure 1 主图初稿，并可导出可编辑图形。">
<link rel="canonical" href="./forge/">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ccircle cx='36' cy='38' r='10' fill='white'/%3E%3Crect x='28' y='54' width='44' height='7' rx='3.5' fill='%23a5b4fc'/%3E%3Crect x='28' y='67' width='30' height='7' rx='3.5' fill='%23a5b4fc'/%3E%3C/svg%3E">
<!-- The gallery is retired: this entry now forwards to FigureForge. -->
<meta http-equiv="refresh" content="0; url=./forge/">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f7f8ff;color:#1f2937;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .card{width:min(420px,calc(100vw - 40px));padding:26px 28px;background:#fff;
    border:1px solid #e5e7f0;border-radius:16px;box-shadow:0 10px 30px rgba(79,70,229,.08);text-align:center}
  .mark{width:44px;height:44px;border-radius:12px;background:#4f46e5;margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
  h1{margin:0 0 6px;font-size:17px}
  p{margin:0 0 16px;color:#6b7280;font-size:13.5px}
  a{display:inline-block;padding:9px 18px;border-radius:10px;background:#4f46e5;color:#fff;
    text-decoration:none;font-weight:600;font-size:13.5px}
  a:hover{background:#4338ca}
  .spin{width:14px;height:14px;border:2px solid #ddd6fe;border-top-color:#4f46e5;border-radius:50%;
    display:inline-block;vertical-align:-2px;margin-right:7px;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">FF</div>
    <h1>正在进入 FigureForge</h1>
    <p><span class="spin" aria-hidden="true"></span>画廊已下线，工具保留：输入论文内容、上传自己的参考图，生成主图初稿。</p>
    <a href="./forge/" id="go">立即进入 / Open FigureForge</a>
  </main>
<script>
  // file:// 下也能跳转；meta refresh 作为无脚本兜底
  location.replace('./forge/');
</script>
</body>
</html>
